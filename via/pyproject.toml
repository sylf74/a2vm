[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "via"
version = "0.13.0"
description = "VIA, pillar 1 (Vulnerability Intelligence: Advanced, AI-assisted, Alerting): vulnerability records and the watch."
requires-python = ">=3.11"
license = {text = "LicenseRef-a2vm-proprietary"}
dependencies = ["a2vm", "docxtpl>=0.18"]  # docxtpl: the Word alert sheet

[project.scripts]
via = "via.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"via.alert" = ["templates/*.docx"]
