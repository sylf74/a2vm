{{- /*
The shared intelligence service (HLD D17, v0.22.0, LLD vulnerability-intelligence §3.10), in the watch
team's release only (tenant via): `via intel-serve`, one replica on a volume of its own (the
technologies watched and the feed). Every tenant's daily run, watch and sender reach it (intel.url);
it reaches the public and licensed sources.
*/ -}}
{{- if .Values.intel.serve.enabled }}
{{- include "a2vm-tenant.checks" . }}
{{- $name := include "a2vm-tenant.name" . }}
{{- $s := .Values.intel.serve }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-intel
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: intel
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if $s.storage.storageClass }}
  storageClassName: {{ $s.storage.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $s.storage.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-intel
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: intel
spec:
  replicas: 1             # one writer on a ReadWriteOnce volume, one GTI quota
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "a2vm-tenant.selector" (dict "root" . "component" "intel") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "a2vm-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: intel
      annotations:
        checksum/digests: {{ $s.digestsChecksum | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: intel
          image: {{ include "a2vm-tenant.image" (dict "root" . "pillar" "via") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- include "a2vm-tenant.settings" . | nindent 14 }}
              exec via intel-serve --settings "$SETTINGS" --digests /intel-secret/digests --store /data/intel \
                --port 8080 --gti-every-hours {{ $s.gtiEveryHours }} --osv-every-hours {{ $s.osvEveryHours | default 6 }}
          env:
            - name: A2VM_CACHE_DIR
              value: /data/cache
            - name: HOME
              value: /tmp
            {{- include "a2vm-tenant.outbound" . | nindent 12 }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.secret.name }}
            - name: GTI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: gti-api-key
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: digests
              mountPath: /intel-secret
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if include "a2vm-tenant.outboundSecrets" . }}
            - name: outbound
              mountPath: /secrets
              readOnly: true
            {{- end }}
          {{- with $s.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-intel
        - name: digests
          secret:
            secretName: {{ $s.digestsSecret }}
            defaultMode: 0440
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: tmp
          emptyDir: {}
        {{- if include "a2vm-tenant.outboundSecrets" . }}
        - name: outbound
          secret:
            secretName: {{ .Values.secret.name }}
            defaultMode: 0440
            items:
              - {key: relay-token, path: relay-token}
              - {key: ca-bundle, path: ca-bundle}
            optional: true
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-intel
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: intel
spec:
  type: ClusterIP
  selector:
    {{- include "a2vm-tenant.selector" (dict "root" . "component" "intel") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if $s.networkPolicy.enabled }}
---
# The tenants' jobs (daily run, watch, send and the review page's sender) of the namespaces allowed; the
# service reaches the sources on the Internet (no egress rule).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-intel
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: intel
spec:
  podSelector:
    matchLabels:
      {{- include "a2vm-tenant.selector" (dict "root" . "component" "intel") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if $s.allowNamespaces }}
        {{- range $s.allowNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [daily, watch, send, tools]}
        {{- end }}
        {{- else }}
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [daily, watch, send, tools]}
        {{- end }}
      ports:
        - {port: 8080, protocol: TCP}
{{- end }}
{{- end }}
