{{- /*
Conversational search of the tenant's analysts (HLD §8, LLD triage §16), all in the namespace:
- tools: `verdict tools`, a read-only OpenAPI tool server on the decision service; it holds the
  service's read token, answers Open WebUI only and connects to the decision service only;
- chat: Open WebUI, on the tenant's approved LLM endpoints (one or several VMs outside the
  cluster), configured from these values only (ENABLE_PERSISTENT_CONFIG=false), behind the ingress;
  it connects to the tool server, the LLM endpoint (or the gateway) and the DNS only;
- llm (several endpoints only): nginx in front of the endpoints, round robin, failed endpoint left
  out and the request sent to the next; Open WebUI itself uses the first connection of a model only.
With oidc.issuerUrl (v0.17.0), the analysts sign in with the tenant's identity provider: only the
members of oidc.readers and oidc.validators get in (role user), oidc.admins become admins; without
oidc.admins the local admin keeps the login form.
*/ -}}
{{- if .Values.chat.enabled }}
{{- include "a2vm-tenant.checks" . }}
{{- $name := include "a2vm-tenant.name" . }}
{{- $chat := .Values.chat }}
{{- $ing := $chat.ingress }}
{{- $prompt := replace "{tenant}" .Values.tenant $chat.systemPrompt }}
{{- $grants := list (dict "principal_type" "user" "principal_id" "*" "permission" "read") }}
{{- $connection := dict "type" "openapi" "url" (include "a2vm-tenant.toolsUrl" .) "spec_type" "url" "path" "openapi.json" "auth_type" "bearer" "key" "__A2VM_TOOLS_TOKEN__" "config" (dict "enable" true "access_grants" $grants) "info" (dict "id" "a2vm" "name" "A2VM" "description" (printf "Vulnerability decisions of tenant %s (read only)" .Values.tenant)) }}
{{- $gateway := gt (len $chat.llm.endpoints) 1 }}
{{- $configs := dict "0" (dict "enable" true "model_ids" (list $chat.llm.model)) }}
{{- $tls := $ing.tlsSecret | default (ternary (printf "%s-chat-tls" $name) "" (ne $ing.clusterIssuer "")) }}
{{- $o := .Values.oidc }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-tools
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "a2vm-tenant.selector" (dict "root" . "component" "tools") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "a2vm-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: tools
        a2vm.io/verdict-reader: "true"
      annotations:
        checksum/digests: {{ $chat.toolsDigestsChecksum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tools
          image: {{ include "a2vm-tenant.image" (dict "root" . "pillar" "verdict") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["verdict", "tools"]
          args:
            - --tenant={{ .Values.tenant }}
            - --verdict-url={{ include "a2vm-tenant.verdictUrl" . }}
            - --read-token-file=/secrets/verdict-read-token
            - --digests=/tools-secret/digests
            - --max-chars={{ $chat.maxChars }}
            - --public-url={{ printf "https://%s" $chat.host }}
            - --export-minutes={{ $chat.exportMinutes }}
            {{- if .Values.watch.enabled }}
            - --via-url={{ include "a2vm-tenant.viaUrl" . }}
            - --via-token-file=/secrets/via-read-token
            {{- end }}
            - --port=8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: digests
              mountPath: /tools-secret
              readOnly: true
          {{- with $chat.tools.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ .Values.secret.name }}
            defaultMode: 0440
            items:
              - key: verdict-read-token
                path: verdict-read-token
              {{- if .Values.watch.enabled }}
              - key: via-read-token
                path: via-read-token
              {{- end }}
        - name: digests
          secret:
            secretName: {{ $chat.toolsDigestsSecret }}
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-tools
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tools
spec:
  type: ClusterIP
  selector:
    {{- include "a2vm-tenant.selector" (dict "root" . "component" "tools") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-chat
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
  annotations:
    # Accounts and chats survive an uninstall: delete the claim by hand to drop them.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if $chat.storage.storageClass }}
  storageClassName: {{ $chat.storage.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $chat.storage.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-chat
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
spec:
  replicas: 1             # SQLite on a ReadWriteOnce volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "a2vm-tenant.selector" (dict "root" . "component" "chat") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "a2vm-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: chat
      annotations:
        checksum/digests: {{ $chat.toolsDigestsChecksum | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chat
          image: "{{ $chat.image.repository }}:{{ $chat.image.tag }}"
          imagePullPolicy: IfNotPresent
          workingDir: /app/backend
          command: ["bash", "-c"]
          args:
            - |
              set -eu
              for f in chat-secret-key chat-admin-password chat-tools-token; do
                if [ ! -s "/chat-secrets/$f" ]; then echo "missing key $f in Secret {{ .Values.secret.name }}" >&2; exit 2; fi
              done
              export WEBUI_SECRET_KEY="$(cat /chat-secrets/chat-secret-key)"
              export WEBUI_ADMIN_PASSWORD="$(cat /chat-secrets/chat-admin-password)"
              key="$(cat /chat-secrets/llm-api-key 2>/dev/null || true)"
              export OPENAI_API_KEYS="$key"
              token="$(tr -cd '0-9a-f' < /chat-secrets/chat-tools-token)"
              export TOOL_SERVER_CONNECTIONS="${TOOL_SERVER_CONNECTIONS_TEMPLATE/__A2VM_TOOLS_TOKEN__/$token}"
              unset TOOL_SERVER_CONNECTIONS_TEMPLATE key token
              {{- if $o.issuerUrl }}
              if [ ! -s /chat-secrets/oidc-client-secret ]; then echo "missing key oidc-client-secret in Secret {{ .Values.secret.name }}" >&2; exit 2; fi
              export OAUTH_CLIENT_SECRET="$(cat /chat-secrets/oidc-client-secret)"
              {{- if $o.ca }}
              cat "$(python -c 'import certifi; print(certifi.where())')" /chat-secrets/oidc-ca > /tmp/ca-bundle.pem
              export SSL_CERT_FILE=/tmp/ca-bundle.pem REQUESTS_CA_BUNDLE=/tmp/ca-bundle.pem AIOHTTP_CLIENT_SSL_CERT_FILE=/tmp/ca-bundle.pem
              {{- end }}
              {{- end }}
              exec bash start.sh
          env:
            - {name: HOME, value: /tmp}
            - {name: DATA_DIR, value: /app/backend/data}
            - {name: STATIC_DIR, value: /app/static}
            - {name: WEBUI_NAME, value: {{ printf "A2VM %s" .Values.tenant | quote }}}
            - {name: WEBUI_URL, value: {{ printf "https://%s" $chat.host | quote }}}
            - {name: CORS_ALLOW_ORIGIN, value: {{ printf "https://%s" $chat.host | quote }}}
            - {name: WEBUI_ADMIN_EMAIL, value: {{ $chat.adminEmail | quote }}}
            - {name: WEBUI_ADMIN_NAME, value: "A2VM admin"}
            # Configuration from these values only: what is changed in the admin panel does not stay.
            - {name: ENABLE_PERSISTENT_CONFIG, value: "false"}
            - {name: ENABLE_SIGNUP, value: "false"}
            - {name: DEFAULT_USER_ROLE, value: pending}
            - {name: JWT_EXPIRES_IN, value: {{ printf "%vh" $chat.sessionHours | quote }}}
            {{- if $o.issuerUrl }}
            # Sign-in with the tenant's identity provider: its groups decide who gets in.
            - {name: ENABLE_OAUTH_SIGNUP, value: "true"}
            - {name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL, value: "false"}
            - {name: OAUTH_CLIENT_ID, value: {{ $o.clientId | quote }}}
            - {name: OPENID_PROVIDER_URL, value: {{ printf "%s/.well-known/openid-configuration" (trimSuffix "/" $o.issuerUrl) | quote }}}
            - {name: OPENID_REDIRECT_URI, value: {{ printf "https://%s/oauth/oidc/callback" $chat.host | quote }}}
            - {name: OAUTH_PROVIDER_NAME, value: {{ $o.providerName | quote }}}
            - {name: OAUTH_SCOPES, value: "openid email profile"}
            - {name: OAUTH_CODE_CHALLENGE_METHOD, value: S256}
            - {name: ENABLE_OAUTH_ROLE_MANAGEMENT, value: "true"}
            - {name: OAUTH_ROLES_CLAIM, value: {{ $o.groupsClaim | quote }}}
            - {name: OAUTH_ALLOWED_ROLES, value: {{ join "," (concat $o.readers $o.validators | uniq) | quote }}}
            - {name: OAUTH_ADMIN_ROLES, value: {{ join "," $o.admins | quote }}}
            - {name: ENABLE_LOGIN_FORM, value: {{ ternary "false" "true" (gt (len $o.admins) 0) | quote }}}
            {{- end }}
            # The tenant's approved endpoints only, its model only.
            - {name: ENABLE_OLLAMA_API, value: "false"}
            - {name: ENABLE_OPENAI_API, value: "true"}
            - {name: OPENAI_API_BASE_URLS, value: {{ include "a2vm-tenant.chatLlmUrl" . | quote }}}
            - {name: OPENAI_API_CONFIGS, value: {{ toJson $configs | quote }}}
            - {name: DEFAULT_MODELS, value: {{ $chat.llm.model | quote }}}
            - {name: ENABLE_DIRECT_CONNECTIONS, value: "false"}
            - {name: ENABLE_OPENAI_API_PASSTHROUGH, value: "false"}
            # The A2VM tools, selected in every chat; the instructions with every chat.
            - {name: TOOL_SERVER_CONNECTIONS_TEMPLATE, value: {{ toJson (list $connection) | quote }}}
            - {name: DEFAULT_MODEL_METADATA, value: {{ toJson (dict "toolIds" (list "server:a2vm")) | quote }}}
            - {name: DEFAULT_MODEL_PARAMS, value: {{ toJson (dict "system" $prompt "temperature" 0.2 "function_calling" "native") | quote }}}
            - {name: DEFAULT_PROMPT_SUGGESTIONS, value: "[]"}
            # No network beyond the tools and the model: no web search, no download, no update check.
            - {name: OFFLINE_MODE, value: "true"}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: ENABLE_WEB_SEARCH, value: "false"}
            - {name: USER_PERMISSIONS_FEATURES_WEB_SEARCH, value: "false"}
            - {name: ENABLE_IMAGE_GENERATION, value: "false"}
            - {name: USER_PERMISSIONS_FEATURES_IMAGE_GENERATION, value: "false"}
            - {name: ENABLE_CODE_EXECUTION, value: "false"}
            - {name: ENABLE_CODE_INTERPRETER, value: "false"}
            - {name: USER_PERMISSIONS_FEATURES_CODE_INTERPRETER, value: "false"}
            - {name: USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS, value: "false"}
            - {name: USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS, value: "false"}
            - {name: USER_PERMISSIONS_CHAT_FILE_UPLOAD, value: "false"}
            - {name: RAG_EMBEDDING_MODEL, value: ""}
            - {name: BYPASS_EMBEDDING_AND_RETRIEVAL, value: "true"}
            - {name: ENABLE_COMMUNITY_SHARING, value: "false"}
            - {name: ENABLE_MEMORIES, value: "false"}
            - {name: ENABLE_ADMIN_EXPORT, value: "false"}
            - {name: ENABLE_VERSION_UPDATE_CHECK, value: "false"}
            - {name: SCARF_NO_ANALYTICS, value: "true"}
            - {name: DO_NOT_TRACK, value: "true"}
            - {name: ANONYMIZED_TELEMETRY, value: "false"}
            # Browser side: nothing loaded from or sent to another host.
            - {name: CONTENT_SECURITY_POLICY, value: {{ $ing.contentSecurityPolicy | replace "\n" " " | quote }}}
            - {name: XFRAME_OPTIONS, value: DENY}
            - {name: REFERRER_POLICY, value: no-referrer}
            - {name: XCONTENT_TYPE, value: nosniff}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: static
              mountPath: /app/static
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /chat-secrets
              readOnly: true
          {{- with $chat.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if gt (int $chat.retentionDays) 0 }}
        # Retention of the chats (Open WebUI has none): every hour, the chats unchanged for
        # chat.retentionDays days are deleted from Open WebUI's database, as Open WebUI deletes one.
        - name: retention
          image: {{ include "a2vm-tenant.image" (dict "root" . "pillar" "verdict") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["verdict", "chat-retention"]
          args:
            - --db=/app/backend/data/webui.db
            - --days={{ $chat.retentionDays }}
            - --every=3600
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 128Mi}
        {{- end }}
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-chat
        - name: static
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret:
            secretName: {{ .Values.secret.name }}
            defaultMode: 0440
            optional: true          # each key is checked at start; llm-api-key may be absent
            items:
              - {key: chat-secret-key, path: chat-secret-key}
              - {key: chat-admin-password, path: chat-admin-password}
              - {key: chat-tools-token, path: chat-tools-token}
              - {key: llm-api-key, path: llm-api-key}
              {{- if $o.issuerUrl }}
              - {key: oidc-client-secret, path: oidc-client-secret}
              {{- if $o.ca }}
              - {key: oidc-ca, path: oidc-ca}
              {{- end }}
              {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-chat
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
spec:
  type: ClusterIP
  selector:
    {{- include "a2vm-tenant.selector" (dict "root" . "component" "chat") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if and (eq $ing.controller "traefik") $ing.allowFrom }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-chat-allow
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
spec:
  ipAllowList:
    sourceRange:
      {{- range $ing.allowFrom }}
      - {{ . | quote }}
      {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-chat
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
  annotations:
    {{- if eq $ing.controller "nginx" }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    {{- if $ing.allowFrom }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ join "," $ing.allowFrom | quote }}
    {{- end }}
    {{- else if and (eq $ing.controller "traefik") $ing.allowFrom }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-chat-allow@kubernetescrd" .Release.Namespace $name | quote }}
    {{- end }}
    {{- if $ing.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $ing.clusterIssuer | quote }}
    {{- end }}
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className | quote }}
  {{- end }}
  tls:
    - hosts: [{{ $chat.host | quote }}]
      {{- if $tls }}
      secretName: {{ $tls | quote }}
      {{- end }}
  rules:
    - host: {{ $chat.host | quote }}
      http:
        paths:
          # Downloads of the documents the tool server built (a link per document, valid for
          # chat.exportMinutes); nothing else of the tool server is published.
          - path: /a2vm/exports/
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-tools
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-chat
                port:
                  name: http
{{- if $chat.networkPolicy.enabled }}
---
# The tool server: from Open WebUI, and from the ingress controller for the downloads; to the
# decision service and the DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-tools
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tools
spec:
  podSelector:
    matchLabels:
      {{- include "a2vm-tenant.selector" (dict "root" . "component" "tools") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "a2vm-tenant.selector" (dict "root" . "component" "chat") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $chat.networkPolicy.ingressNamespace | quote }}
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "a2vm-tenant.selector" (dict "root" . "component" "verdict") | nindent 14 }}
      ports:
        - {port: 8080, protocol: TCP}
    {{- if .Values.watch.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "a2vm-tenant.selector" (dict "root" . "component" "via") | nindent 14 }}
      ports:
        - {port: 8080, protocol: TCP}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $chat.networkPolicy.dnsNamespace | quote }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
# Open WebUI: from the ingress controller only; to the tool server, the LLM endpoints and the DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-chat
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
spec:
  podSelector:
    matchLabels:
      {{- include "a2vm-tenant.selector" (dict "root" . "component" "chat") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $chat.networkPolicy.ingressNamespace | quote }}
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "a2vm-tenant.selector" (dict "root" . "component" "tools") | nindent 14 }}
      ports:
        - {port: 8080, protocol: TCP}
    {{- if $gateway }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "a2vm-tenant.selector" (dict "root" . "component" "llm") | nindent 14 }}
      ports:
        - {port: 8080, protocol: TCP}
    {{- else }}
    {{- range $chat.llm.egress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - {port: {{ .port }}, protocol: TCP}
    {{- end }}
    {{- end }}
    {{- if $o.issuerUrl }}
    {{- include "a2vm-tenant.oidcEgress" . | nindent 4 }}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $chat.networkPolicy.dnsNamespace | quote }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
{{- if $gateway }}
---
# The LLM gateway: from Open WebUI only; to the LLM endpoints and the DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-llm
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm
spec:
  podSelector:
    matchLabels:
      {{- include "a2vm-tenant.selector" (dict "root" . "component" "llm") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "a2vm-tenant.selector" (dict "root" . "component" "chat") | nindent 14 }}
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    {{- range $chat.llm.egress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - {port: {{ .port }}, protocol: TCP}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $chat.networkPolicy.dnsNamespace | quote }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
{{- end }}
{{- end }}
{{- if $gateway }}
{{- $gw := $chat.llm.gateway }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-llm
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 256; }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server_tokens off;
      # Method, path, status, endpoint and time; never a header or a body (they carry client data).
      log_format llm '$time_iso8601 $request_method $uri $status upstream=$upstream_addr upstream_status=$upstream_status seconds=$request_time';
      access_log /dev/stdout llm;
      upstream llm {
        {{- range $chat.llm.endpoints }}
        {{- $u := urlParse . }}
        server {{ if contains ":" $u.host }}{{ $u.host }}{{ else }}{{ $u.host }}:80{{ end }} max_fails=1 fail_timeout={{ $gw.failSeconds }}s;
        {{- end }}
        keepalive 16;
      }
      server {
        listen 8080;
        client_max_body_size 8m;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location {{ (urlParse (first $chat.llm.endpoints)).path | trimSuffix "/" }}/ {
          proxy_pass http://llm;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_request_buffering on;
          proxy_connect_timeout {{ $gw.connectSeconds }}s;
          proxy_read_timeout {{ $gw.readSeconds }}s;
          proxy_send_timeout {{ $gw.readSeconds }}s;
          # A request goes to the next endpoint when one is down or busy, before any answer started.
          proxy_next_upstream error timeout http_429 http_502 http_503 http_504 non_idempotent;
          proxy_next_upstream_tries 0;
        }
        location / { return 404; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-llm
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "a2vm-tenant.selector" (dict "root" . "component" "llm") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "a2vm-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: llm
      annotations:
        checksum/endpoints: {{ toJson $chat.llm.endpoints | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: llm
          image: {{ $gw.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-c", "/etc/a2vm/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: conf
              mountPath: /etc/a2vm
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with $gw.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: conf
          configMap:
            name: {{ $name }}-llm
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-llm
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm
spec:
  type: ClusterIP
  selector:
    {{- include "a2vm-tenant.selector" (dict "root" . "component" "llm") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
{{- end }}
