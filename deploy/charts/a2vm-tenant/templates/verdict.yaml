{{- /*
Decision service of the tenant, read side (LLD triage §15): `verdict serve`, one replica on a
volume of its own (runs as files until PostgreSQL, D15), the digests of its publish and read tokens
from a Secret. Fed by the daily run's `publish` step; read inside the cluster, no ingress.
*/ -}}
{{- if .Values.verdict.enabled }}
{{- include "a2vm-tenant.checks" . }}
{{- $name := include "a2vm-tenant.name" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-runs
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
  annotations:
    # The runs received survive an uninstall: delete the claim by hand to drop them.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.verdict.storage.storageClass }}
  storageClassName: {{ .Values.verdict.storage.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.verdict.storage.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-verdict
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: verdict
spec:
  replicas: 1             # one writer on a ReadWriteOnce volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "a2vm-tenant.selector" (dict "root" . "component" "verdict") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "a2vm-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: verdict
      annotations:
        checksum/digests: {{ .Values.verdict.digestsChecksum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: verdict
          image: {{ include "a2vm-tenant.image" (dict "root" . "pillar" "verdict") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["verdict", "serve"]
          args:
            - --tenant={{ .Values.tenant }}
            - --digests=/verdict-secret/digests
            - --store=/data/runs
            - --keep={{ .Values.verdict.keep }}
            - --max-mb={{ .Values.verdict.maxMb }}
            - --port=8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: digests
              mountPath: /verdict-secret
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.verdict.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-runs
        - name: digests
          secret:
            secretName: {{ .Values.verdict.digestsSecret }}
            defaultMode: 0440   # readable by the service group (fsGroup)
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-verdict
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: verdict
spec:
  type: ClusterIP
  selector:
    {{- include "a2vm-tenant.selector" (dict "root" . "component" "verdict") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.verdict.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-verdict
  labels:
    {{- include "a2vm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: verdict
spec:
  podSelector:
    matchLabels:
      {{- include "a2vm-tenant.selector" (dict "root" . "component" "verdict") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "a2vm-tenant.selector" (dict "root" . "component" "daily") | nindent 14 }}
        - podSelector:
            matchLabels:
              a2vm.io/verdict-reader: "true"
      ports:
        - port: 8080
          protocol: TCP
  egress: []              # the service opens no connection
{{- end }}
{{- end }}
