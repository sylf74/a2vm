apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ngvm-tenant.name" . }}-data
  labels:
    {{- include "ngvm-tenant.labels" . | nindent 4 }}
  annotations:
    # The working files survive an uninstall: delete the claim by hand to drop them.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storage.storageClass }}
  storageClassName: {{ .Values.storage.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size | quote }}
