{{- /*
A development identity provider (v0.23.15, docs/dev-idp.md): one Keycloak for a tenant whose
company gives no client to NGVM, never for production. Its realm (deploy/chat/dev_idp_values.py)
is imported at the first start; its secrets come from the Secret: the admin's password
(dev-idp-admin-password), the client's secret (dev-idp-client-secret) and each account's temporary
password (dev-idp-password-<n>). Its data on a volume (H2 file database, enough for a few accounts).
*/ -}}
{{- if .Values.devIdp.enabled }}
{{- $d := .Values.devIdp }}
{{- $name := printf "%s-idp-dev" (include "ngvm-tenant.name" .) }}
{{- $_ := required "devIdp.host is required" $d.host }}
{{- if not .Values.secret.name }}
{{- fail "devIdp.enabled needs secret.name (keys dev-idp-admin-password, dev-idp-client-secret)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "ngvm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: idp-dev
data:
  ngvm-dev-realm.json: {{ toJson $d.realm | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "ngvm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: idp-dev
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $d.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $d.storage.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ngvm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: idp-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ngvm-tenant.selector" (dict "root" . "component" "idp-dev") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ngvm-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: idp-dev
      annotations:
        checksum/realm: {{ toJson $d.realm | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keycloak
          image: {{ $d.image | quote }}
          imagePullPolicy: IfNotPresent
          # The realm is imported when it does not exist yet; an existing one is left as it is.
          args: ["start", "--import-realm"]
          env:
            - {name: KC_DB, value: dev-file}
            - {name: KC_HOSTNAME, value: {{ printf "https://%s" $d.host | quote }}}
            # The admin console is not published: kubectl port-forward, then http://localhost:8080/admin
            - {name: KC_HOSTNAME_ADMIN, value: "http://localhost:8080"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secret.name }}, key: dev-idp-admin-password}}
            - name: NGVM_DEV_IDP_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.secret.name }}, key: dev-idp-client-secret}}
            {{- range $i, $_ := until (int $d.users) }}
            - name: {{ printf "NGVM_DEV_IDP_PW_%d" $i }}
              valueFrom: {secretKeyRef: {name: {{ $.Values.secret.name }}, key: {{ printf "dev-idp-password-%d" $i }}}}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          {{- with $d.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}
        - name: realm
          configMap:
            name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ngvm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: idp-dev
spec:
  type: ClusterIP
  selector:
    {{- include "ngvm-tenant.selector" (dict "root" . "component" "idp-dev") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "ngvm-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: idp-dev
  annotations:
    {{- if $d.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $d.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- if eq $d.ingress.controller "nginx" }}
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    {{- end }}
spec:
  {{- if $d.ingress.className }}
  ingressClassName: {{ $d.ingress.className | quote }}
  {{- end }}
  tls:
    - hosts: [{{ $d.host | quote }}]
      secretName: {{ $d.ingress.tlsSecret | default (printf "%s-tls" $name) | quote }}
  rules:
    - host: {{ $d.host | quote }}
      http:
        paths:
          # The realm only: the admin console stays inside the cluster (kubectl port-forward).
          - path: /realms/
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
          - path: /resources/
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
