[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnops"
version = "0.10.0"
description = "vulnops common contract: data model, exchange files and their schemas, settings, client profiles, LLM client, extension points between pillars."
requires-python = ">=3.11"
license = {text = "LicenseRef-vulnops-proprietary"}
dependencies = ["httpx>=0.27", "PyYAML>=6.0", "jsonschema>=4.20"]

[project.scripts]
vulnops = "vulnops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vulnops" = ["schemas/*.json"]
