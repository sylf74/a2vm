# A2VM client pipeline — included by each client project, never run in the code project.
#
# A client project holds only its own data:
#   client.yaml      client profile (schema v2)
#   targets.yaml     read-only SSH collection targets and/or an OpenVAS network scan (optional:
#                    without it, declared inventory only)
#   contacts.yaml    who receives the alerts, with their role and levels (optional)
#   watch-sources.yaml  optional, replaces the code's catalogue of watch sources for this client
#   settings.yaml    optional, overrides the default settings of the A2VM version in use
#   .gitlab-ci.yml   includes this file at a fixed version:
#
#     include:
#       - project: vulnops/a2vm
#         ref: v0.11.5
#         file: templates/client-pipeline.yml
#     variables:
#       A2VM_REF: v0.11.5        # same version as the include
#
# Jobs:
#   push to the default branch     validate (profile and targets)
#   schedule or "Run pipeline"     collect -> via -> detect -> assets -> triage
#                                  optional TRIAGE_CVES="CVE-... CVE-...", TRIAGE_SINCE (default 26h)
#   same, with A2VM_JOB=watch   watch (CERT-FR, KEV, critical CVEs matched to the client; alerts
#                                  mailed to the analysts) -> send-alerts (manual: the validation)
#
# CI/CD variables (client project, or inherited from the groups):
#   A2VM_SSH_KEY          File, protected: private key of this client's read-only scan account
#   A2VM_GVM_USER, A2VM_GVM_PASSWORD (masked)   OpenVAS (GMP) account, when targets.yaml has
#                            an openvas section; A2VM_GVM_CA, A2VM_GVM_CERT, A2VM_GVM_KEY
#                            (File) for a tls:// GMP endpoint with client certificates (docs/openvas.md)
#   A2VM_RUNNER_TAG, A2VM_COLLECT_TAG   runner tags (default llm-lan): set A2VM_COLLECT_TAG
#                            in the client .gitlab-ci.yml to run the collection on the scanner host
#                            itself (docs/openvas.md, "Scanner host as runner")
#   An OpenVAS scan often runs longer than GitLab's default job timeout (1 h): raise the project's
#   timeout (Settings > CI/CD > General pipelines) above the targets' timeout_minutes (default 240).
#   A2VM_LLM_ENABLED, A2VM_LLM_BASE_URL, A2VM_LLM_MODEL, LLM_API_KEY   (usually set on the group)
#   A2VM_SMTP_HOST, A2VM_SMTP_PORT, A2VM_SMTP_TLS, A2VM_SMTP_USER, A2VM_SMTP_PASSWORD,
#   A2VM_MAIL_FROM, A2VM_ANALYST_TO   (watch mode, usually set on the group)
#
# The code is fetched with the job token: in the A2VM code project (vulnops/a2vm), Settings > CI/CD >
# Job token permissions must allow the client projects (e.g. the group vulnops/clients).

variables:
  A2VM_PROJECT: vulnops/a2vm
  A2VM_REF: main
  A2VM_PROFILE: client.yaml
  A2VM_TARGETS: targets.yaml
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  A2VM_CACHE_DIR: "$CI_PROJECT_DIR/.cache"
  DEBIAN_FRONTEND: noninteractive
  PIP_ROOT_USER_ACTION: ignore
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"   # messages reach the job log as they are written
  A2VM_RUNNER_TAG: llm-lan
  A2VM_COLLECT_TAG: llm-lan

stages: [validate, collect, via, detect, assets, triage, publish, watch, send]

.a2vm:
  image: python:3.12-slim
  tags: ["$A2VM_RUNNER_TAG"]
  interruptible: false
  cache:
    - {key: pip, paths: [.pip-cache/]}
    - {key: sources, paths: [.cache/]}
  before_script:
    # CI/CD variables renamed VULNOPS_* -> A2VM_* in v0.11.1: a VULNOPS_ variable still defined, whose
    # A2VM_ name is not, is copied with a warning. Not for the variables this template defines
    # (A2VM_REF, A2VM_PROJECT, A2VM_PROFILE, A2VM_TARGETS, runner tags): rename them in .gitlab-ci.yml.
    - |
      for v in $(env | sed -n 's/^VULNOPS_\([A-Z0-9_]*\)=.*/\1/p' | sort -u); do
        if eval "[ -z \"\${A2VM_$v+x}\" ]"; then
          eval "export A2VM_$v=\"\$VULNOPS_$v\""; echo "WARN  CI/CD variable VULNOPS_$v is deprecated: rename it A2VM_$v"
        fi
      done
    - apt-get update -qq && apt-get install -y -qq git openssh-client >/dev/null
    # GitLab behind a private CA: the runner hands its CA file to the job
    - if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi
    # GitLab behind a reverse proxy that asks for a client certificate (runner tls-cert-file)
    - if [ -n "${CI_SERVER_TLS_CERT_FILE:-}" ]; then export GIT_SSL_CERT="$CI_SERVER_TLS_CERT_FILE" GIT_SSL_KEY="$CI_SERVER_TLS_KEY_FILE"; fi
    # A runner outside the LAN reaches GitLab by another URL: A2VM_SERVER_URL in its environment
    - BASE="${A2VM_SERVER_URL:-${VULNOPS_SERVER_URL:-${CI_SERVER_PROTOCOL}://${CI_SERVER_HOST}:${CI_SERVER_PORT}}}"
    - git -c advice.detachedHead=false clone -q --depth 1 --branch "$A2VM_REF"
        "${BASE%%://*}://gitlab-ci-token:${CI_JOB_TOKEN}@${BASE#*://}/${A2VM_PROJECT}.git" .a2vm
    - pip install --quiet .a2vm/a2vm .a2vm/via ".a2vm/detect[openvas]" .a2vm/verdict .a2vm/dispatch
    - if [ -f settings.yaml ]; then export SETTINGS=settings.yaml; else export SETTINGS=.a2vm/config/settings.yaml; fi
    - echo "A2VM $A2VM_REF ($(git -C .a2vm rev-parse --short HEAD)), client $CI_PROJECT_PATH, mode ${A2VM_JOB:-${VULNOPS_JOB:-daily}}, settings $SETTINGS"

.data:
  extends: .a2vm
  rules:
    - if: $A2VM_JOB == "watch" || $VULNOPS_JOB == "watch"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  artifacts:
    paths: [work/]
    expire_in: 7 days

validate:
  extends: .a2vm
  stage: validate
  rules:
    - if: $A2VM_JOB == "watch" || $VULNOPS_JOB == "watch"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  script:
    - a2vm validate "$A2VM_PROFILE"
    - if [ -f "$A2VM_TARGETS" ]; then detect plan "$A2VM_TARGETS" --profile "$A2VM_PROFILE"; fi
    - if [ -f contacts.yaml ]; then via contacts "$A2VM_PROFILE" --contacts contacts.yaml; fi
    - if [ -f templates/alert.docx ]; then via check-template templates/alert.docx; fi

# Exit code 3 = collection incomplete: the job shows as a warning and the pipeline goes on with
# what was collected (plus the declared inventory).
collect:
  extends: .data
  stage: collect
  tags: ["$A2VM_COLLECT_TAG"]
  needs: [validate]
  allow_failure:
    exit_codes: [3]
  artifacts:
    when: always
    paths: [work/]
    expire_in: 7 days
  script:
    - mkdir -p work/detect
    - |
      rc=0
      if [ ! -f "$A2VM_TARGETS" ]; then
        echo "No $A2VM_TARGETS: no scanner collection, declared inventory only"
      else
        NO_SSH=""
        if [ -z "${A2VM_SSH_KEY:-}" ]; then
          echo "No A2VM_SSH_KEY: SSH targets skipped (OpenVAS scan only, if configured)"; NO_SSH="--no-ssh"
        else
          # Normalise the key pasted in GitLab: no CR, a final newline (OpenSSH rejects the key otherwise).
          mkdir -p ~/.ssh && umask 077
          tr -d '\r' < "$A2VM_SSH_KEY" | sed -e '$a\' > ~/.ssh/vulnops_scan
          if ! ssh-keygen -y -f ~/.ssh/vulnops_scan > /dev/null 2>&1; then
            echo "A2VM_SSH_KEY is not a usable private key: paste the whole file, from the BEGIN line to the END line"
            exit 3
          fi
          echo "scan key: $(ssh-keygen -l -f ~/.ssh/vulnops_scan)"
        fi
        detect collect "$A2VM_TARGETS" $NO_SSH --raw work/scans --out work/detect || rc=$?
        # Raw outputs are not kept: Trivy JSON runs to hundreds of MB; what matters is in work/detect.
        rm -rf work/scans
      fi
      # The client's external scan (its collection-only project), when this project names it.
      if [ -n "${A2VM_EXTERNAL_PROJECT:-}" ]; then
        detect external "$A2VM_PROFILE" --project "$A2VM_EXTERNAL_PROJECT" --out work/detect || rc=$?
      fi
      du -sh work/* 2>/dev/null || true
      if [ "$rc" -ne 0 ]; then exit 3; fi

via:
  extends: .data
  stage: via
  needs: [collect]
  script:
    - |
      ARGS=""
      for c in ${TRIAGE_CVES:-}; do ARGS="$ARGS --cve $c"; done
      if [ -z "$ARGS" ]; then ARGS="--since ${TRIAGE_SINCE:-26h}"; fi
      via collect --settings "$SETTINGS" --detect work/detect --out work/records.json $ARGS

detect:
  extends: .data
  stage: detect
  needs: [via]
  script:
    - detect inventory "$A2VM_PROFILE" --settings "$SETTINGS" --records work/records.json --out work/detect

assets:
  extends: .data
  stage: assets
  needs: [detect]
  script:
    - verdict assets build "$A2VM_PROFILE" --detect work/detect --out work/assets

triage:
  extends: .data
  stage: triage
  needs: [assets]
  # The inventory is also left in the runner cache, where the watch (every 10 minutes) reads it:
  # the artifacts API only answers for the latest pipeline, which is nearly always a watch.
  cache:
    - {key: pip, paths: [.pip-cache/]}
    - {key: sources, paths: [.cache/]}
    - {key: inventory, paths: [work/assets/], policy: push}
  script:
    - verdict run "$A2VM_PROFILE" --settings "$SETTINGS" --records work/records.json --assets work/assets --out output
  artifacts:
    name: "triage-$CI_PROJECT_NAME-$CI_PIPELINE_ID"
    paths: [output/, work/assets/]
    expire_in: 30 days

# The run's reporting dataset into the reporting database (dashboards read it, never GitLab), when
# the project has A2VM_REPORTING_DSN (masked) and, to verify the server, A2VM_REPORTING_CA (File).
# Exit code 3: database unreachable or refused (warning; the next run publishes again).
publish:
  extends: .a2vm
  stage: publish
  needs: [triage]
  rules:
    - if: $A2VM_JOB == "watch" || $VULNOPS_JOB == "watch"
      when: never
    - if: $A2VM_REPORTING_DSN && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
  allow_failure:
    exit_codes: [3]
  script:
    - dispatch publish output/*/reporting.json

# -- Watch mode: schedule every 10 minutes with the variable A2VM_JOB=watch -------------------
# The state (what was already seen) lives in the GitLab cache; without it, a run only records the
# current state and alerts on nothing. Exit code 3: a source or the mail failed (warning).
watch:
  extends: .a2vm
  stage: watch
  rules:
    - if: ($A2VM_JOB == "watch" || $VULNOPS_JOB == "watch") && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
  resource_group: watch
  cache:
    - {key: pip, paths: [.pip-cache/]}
    - {key: sources, paths: [.cache/]}  # CVE records and GTI answers, shared with the daily run
    - {key: watch-state, paths: [.watch/], when: always}
    - {key: inventory, paths: [work/assets/], policy: pull}  # left by the daily triage job
  allow_failure:
    exit_codes: [3]
  script:
    - if [ -f watch-sources.yaml ]; then export SOURCES=watch-sources.yaml; else export SOURCES=.a2vm/config/watch-sources.yaml; fi
    - via watch "$A2VM_PROFILE" --settings "$SETTINGS" --sources "$SOURCES" --state .watch/state.json --out alerts
  artifacts:
    when: always
    paths: [alerts/]
    expire_in: 14 days

# The analyst's validation: running this job mails the alerts of this pipeline to the client. To send
# only some of them, set A2VM_SEND_ONLY in the job's form before ▶: their numbers in the analysts'
# mail (1 3) or their ids. The job writes alerts/sent.json and adds its events to the alerts journal.
send-alerts:
  extends: .a2vm
  stage: send
  needs: [watch]
  rules:
    - if: ($A2VM_JOB == "watch" || $VULNOPS_JOB == "watch") && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
      when: manual
      allow_failure: true
  resource_group: watch   # one writer of the alerts journal at a time
  cache:
    - {key: pip, paths: [.pip-cache/]}
    - {key: watch-state, paths: [.watch/], when: always}
  script:
    # The analysts' edits are committed after this pipeline started: read them from the branch head.
    - |
      if git fetch -q --depth 1 origin "$CI_DEFAULT_BRANCH" && git checkout -q FETCH_HEAD -- edits 2>/dev/null; then
        echo "edits/ read from $CI_DEFAULT_BRANCH ($(git rev-parse --short FETCH_HEAD)): $(ls edits | wc -l) file(s)"
      else
        echo "no edits/ on $CI_DEFAULT_BRANCH: the sheets are sent as drafted"
      fi
    # alerts.attach: [pdf] -> the PDF is made from the Word sheet now: LibreOffice and fonts metric-
    # compatible with Calibri, Cambria, Arial and Times (installed in this manual job only).
    - |
      if python3 -c "import sys, yaml; a = (yaml.safe_load(open(sys.argv[1])) or {}).get('alerts') or {}; sys.exit(0 if 'pdf' in (a.get('attach') or []) else 1)" "$A2VM_PROFILE"; then
        echo "alerts.attach: pdf -> installing LibreOffice"
        apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation >/dev/null
      fi
    - via send "$A2VM_PROFILE" --alerts alerts --journal .watch/alerts-log.jsonl --edits edits
  artifacts:
    when: always
    paths: [alerts/sent.json, alerts/alerts-log.jsonl, alerts/pdf/]
    expire_in: 90 days

# Checks the mail settings (A2VM_MAIL_FROM, SMTP or Graph, A2VM_ANALYST_TO): Build > Pipelines >
# New pipeline (or ▶ on a schedule), then ▶ on this job. To another address: A2VM_TEST_TO in its form.
test-mail:
  extends: .a2vm
  stage: send
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"
      when: manual
      allow_failure: true
  cache:
    - {key: pip, paths: [.pip-cache/]}
  script:
    - via test-mail ${A2VM_TEST_TO:+--to $A2VM_TEST_TO}
