# A2VM client pipeline — included by each client project, never run in the code project.
#
# A client project holds only its own data:
#   client.yaml      client profile (schema v2)
#   targets.yaml     read-only SSH collection targets and/or an OpenVAS network scan (optional:
#                    without it, declared inventory only)
#   contacts.yaml    who receives the alerts, with their role and levels (optional)
#   watch-sources.yaml  optional, replaces the code's catalogue of watch sources for this client
#   settings.yaml    optional, overrides the default settings of the A2VM version in use
#   collectors.yaml  optional: the collectors that push this client's detections to its detection
#                    service on Kubernetes (docs/collectors.md)
#   .gitlab-ci.yml   includes this file at a fixed version:
#
#     include:
#       - project: vulnops/a2vm
#         ref: v0.17.2
#         file: templates/client-pipeline.yml
#     variables:
#       A2VM_REF: v0.17.2        # same version as the include
#
# Jobs:
#   push to the default branch     validate (profile and targets)
#   schedule or "Run pipeline"     collect -> via -> detect -> assets -> triage
#                                  optional TRIAGE_CVES="CVE-... CVE-...", TRIAGE_SINCE (default 26h)
#   same, with A2VM_JOB=watch   watch (CERT-FR, KEV, critical CVEs matched to the client; alerts
#                                  mailed to the analysts) -> send-alerts (manual: the validation)
#   push or "Run pipeline", with A2VM_K8S_CONTEXT   deploy-k8s: the daily run as a Kubernetes
#                                  CronJob (docs/kubernetes.md)
#
# CI/CD variables (client project, or inherited from the groups):
#   A2VM_SSH_KEY          File, protected: private key of this client's read-only scan account
#   A2VM_COLLECTOR_TOKEN_<ID> (masked, protected)   token of each collector of collectors.yaml;
#                            A2VM_INTAKE_HOST, A2VM_INTAKE_ALLOW, A2VM_INTAKE_INGRESS_CONTROLLER
#                            (nginx, traefik), A2VM_INTAKE_CLUSTER_ISSUER: its push endpoint (docs/collectors.md)
#   A2VM_VERDICT_SERVICE  false: no decision service in the cluster (default true; docs/kubernetes.md)
#   A2VM_CHAT_HOST        the analysts' chat on the decision service (Open WebUI); A2VM_CHAT_ALLOW,
#                            A2VM_CHAT_ADMIN_EMAIL, A2VM_CHAT_RETENTION_DAYS, A2VM_CHAT_LLM_EGRESS... (docs/chat.md)
#   A2VM_OIDC_ISSUER, A2VM_OIDC_CLIENT_ID, A2VM_OIDC_CLIENT_SECRET (masked), A2VM_OIDC_READERS,
#                            A2VM_OIDC_VALIDATORS, A2VM_OIDC_CA (File)...   sign-in of the analysts with
#                            the tenant's identity provider; A2VM_ALERTS_HOST: the review page of the
#                            alerts (A2VM_RUN_MODE=kubernetes) (docs/sign-in.md)
#   A2VM_GVM_USER, A2VM_GVM_PASSWORD (masked)   OpenVAS (GMP) account, when targets.yaml has
#                            an openvas section; A2VM_GVM_CA, A2VM_GVM_CERT, A2VM_GVM_KEY
#                            (File) for a tls:// GMP endpoint with client certificates (docs/openvas.md)
#   A2VM_RUNNER_TAG, A2VM_COLLECT_TAG   runner tags (default llm-lan): set A2VM_COLLECT_TAG
#                            in the client .gitlab-ci.yml to run the collection on the scanner host
#                            itself (docs/openvas.md, "Scanner host as runner")
#   An OpenVAS scan often runs longer than GitLab's default job timeout (1 h): raise the project's
#   timeout (Settings > CI/CD > General pipelines) above the targets' timeout_minutes (default 240).
#   A2VM_LLM_ENABLED, A2VM_LLM_BASE_URL, A2VM_LLM_MODEL, LLM_API_KEY   (usually set on the group)
#   A2VM_SMTP_HOST, A2VM_SMTP_PORT, A2VM_SMTP_TLS, A2VM_SMTP_USER, A2VM_SMTP_PASSWORD,
#   A2VM_MAIL_FROM, A2VM_ANALYST_TO   (watch mode, usually set on the group)
#
# The code is fetched with the job token: in the A2VM code project (vulnops/a2vm), Settings > CI/CD >
# Job token permissions must allow the client projects (e.g. the group vulnops/clients).

variables:
  A2VM_PROJECT: vulnops/a2vm
  A2VM_REF: main
  A2VM_PROFILE: client.yaml
  A2VM_TARGETS: targets.yaml
  A2VM_COLLECTORS: collectors.yaml
  # gitlab: the daily run and the watch run in these pipelines; kubernetes: they run in the tenant's
  # namespace (deploy-k8s deploys them) and the scheduled pipelines do nothing (docs/kubernetes.md §5).
  A2VM_RUN_MODE: gitlab
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  A2VM_CACHE_DIR: "$CI_PROJECT_DIR/.cache"
  DEBIAN_FRONTEND: noninteractive
  PIP_ROOT_USER_ACTION: ignore
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"   # messages reach the job log as they are written
  A2VM_RUNNER_TAG: llm-lan
  A2VM_COLLECT_TAG: llm-lan

stages: [validate, deploy, collect, via, detect, assets, triage, publish, watch, send]

.a2vm:
  image: python:3.12-slim
  tags: ["$A2VM_RUNNER_TAG"]
  interruptible: false
  cache:
    - {key: pip, paths: [.pip-cache/]}
    - {key: sources, paths: [.cache/]}
  before_script:
    # CI/CD variables renamed VULNOPS_* -> A2VM_* in v0.11.1: a VULNOPS_ variable still defined, whose
    # A2VM_ name is not, is copied with a warning. Not for the variables this template defines
    # (A2VM_REF, A2VM_PROJECT, A2VM_PROFILE, A2VM_TARGETS, runner tags): rename them in .gitlab-ci.yml.
    - |
      for v in $(env | sed -n 's/^VULNOPS_\([A-Z0-9_]*\)=.*/\1/p' | sort -u); do
        if eval "[ -z \"\${A2VM_$v+x}\" ]"; then
          eval "export A2VM_$v=\"\$VULNOPS_$v\""; echo "WARN  CI/CD variable VULNOPS_$v is deprecated: rename it A2VM_$v"
        fi
      done
    - apt-get update -qq && apt-get install -y -qq git openssh-client >/dev/null
    # GitLab behind a private CA: the runner hands its CA file to the job
    - if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi
    # GitLab behind a reverse proxy that asks for a client certificate (runner tls-cert-file)
    - if [ -n "${CI_SERVER_TLS_CERT_FILE:-}" ]; then export GIT_SSL_CERT="$CI_SERVER_TLS_CERT_FILE" GIT_SSL_KEY="$CI_SERVER_TLS_KEY_FILE"; fi
    # A runner outside the LAN reaches GitLab by another URL: A2VM_SERVER_URL in its environment
    - BASE="${A2VM_SERVER_URL:-${VULNOPS_SERVER_URL:-${CI_SERVER_PROTOCOL}://${CI_SERVER_HOST}:${CI_SERVER_PORT}}}"
    - git -c advice.detachedHead=false clone -q --depth 1 --branch "$A2VM_REF"
        "${BASE%%://*}://gitlab-ci-token:${CI_JOB_TOKEN}@${BASE#*://}/${A2VM_PROJECT}.git" .a2vm
    - pip install --quiet .a2vm/a2vm .a2vm/via ".a2vm/detect[openvas]" .a2vm/verdict
    - if [ -f settings.yaml ]; then export SETTINGS=settings.yaml; else export SETTINGS=.a2vm/config/settings.yaml; fi
    - echo "A2VM $A2VM_REF ($(git -C .a2vm rev-parse --short HEAD)), client $CI_PROJECT_PATH, mode ${A2VM_JOB:-${VULNOPS_JOB:-daily}}, settings $SETTINGS"

.data:
  extends: .a2vm
  rules:
    - if: $A2VM_JOB == "watch" || $VULNOPS_JOB == "watch" || $A2VM_JOB == "send"
      when: never
    - if: $A2VM_RUN_MODE == "kubernetes"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  artifacts:
    paths: [work/]
    expire_in: 7 days

validate:
  extends: .a2vm
  stage: validate
  rules:
    - if: $A2VM_JOB == "watch" || $VULNOPS_JOB == "watch" || $A2VM_JOB == "send"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  script:
    - a2vm validate "$A2VM_PROFILE"
    - |
      if [ "$A2VM_RUN_MODE" = "kubernetes" ] && [ -z "${A2VM_K8S_CONTEXT:-}" ]; then
        echo "A2VM_RUN_MODE=kubernetes needs A2VM_K8S_CONTEXT: nothing would run (docs/kubernetes.md)"; exit 1
      fi
    - if [ -f "$A2VM_TARGETS" ]; then detect plan "$A2VM_TARGETS" --profile "$A2VM_PROFILE"; fi
    - if [ -f "$A2VM_COLLECTORS" ]; then detect collectors "$A2VM_COLLECTORS" --tenant "$(echo "$CI_PROJECT_NAME" | tr 'A-Z_' 'a-z-')" --profile "$A2VM_PROFILE"; fi
    - if [ -f contacts.yaml ]; then via contacts "$A2VM_PROFILE" --contacts contacts.yaml; fi
    - for t in templates/alert*.docx; do if [ -f "$t" ]; then via check-template "$t" || exit 1; fi; done

# -- Kubernetes (HLD D15, step 1): the daily run as a CronJob in the cluster -----------------------
# When A2VM_K8S_CONTEXT names a GitLab agent context allowed for this project (e.g.
# vulnops/k8s:homelab), each push to the default branch and each "Run pipeline" deploys this tenant
# with the chart deploy/charts/a2vm-tenant of A2VM_REF (a release tag: the images exist for tags
# only): this project's profile, targets and settings, its secrets from its CI/CD variables, the
# pillar images from the code project's registry. Variables: docs/kubernetes.md.
deploy-k8s:
  stage: deploy
  image: alpine:3.22
  tags: ["$A2VM_RUNNER_TAG"]
  needs: [validate]
  rules:
    - if: $A2VM_JOB == "watch" || $VULNOPS_JOB == "watch" || $A2VM_JOB == "send"
      when: never
    - if: $A2VM_K8S_CONTEXT && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
  cache: []
  script:
    - apk add --no-cache -q git helm kubectl
    - if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi
    - BASE="${A2VM_SERVER_URL:-${CI_SERVER_PROTOCOL}://${CI_SERVER_HOST}:${CI_SERVER_PORT}}"
    - git -c advice.detachedHead=false clone -q --depth 1 --branch "$A2VM_REF"
        "${BASE%%://*}://gitlab-ci-token:${CI_JOB_TOKEN}@${BASE#*://}/${A2VM_PROJECT}.git" .a2vm
    - kubectl config use-context "$A2VM_K8S_CONTEXT"
    # GitLab behind a private CA: kubectl reaches the cluster through GitLab (File variable).
    - if [ -n "${A2VM_K8S_CA:-}" ]; then kubectl config set-cluster gitlab --certificate-authority="$A2VM_K8S_CA"; fi
    - NS="${A2VM_K8S_NAMESPACE:-a2vm-$(echo "$CI_PROJECT_NAME" | tr 'A-Z_' 'a-z-')}"
    - kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
    # Detection service (HLD D15 step 2), when the project declares its collectors: the digests of
    # their tokens (A2VM_COLLECTOR_TOKEN_<ID>) in the Secret a2vm-intake, the read token of the
    # daily run kept from one deployment to the next; no token is printed (docs/collectors.md).
    - |
      INTAKE=""; READ_TOKEN=""; I="$(mktemp -d)"; chmod 700 "$I"
      if [ -f "$A2VM_COLLECTORS" ]; then
        apk add --no-cache -q python3 py3-yaml
        kubectl -n "$NS" get secret a2vm-tenant -o jsonpath='{.data.detect-read-token}' 2>/dev/null \
          | base64 -d > "$I/deployed-read-token" 2>/dev/null || true
        python3 .a2vm/deploy/intake/intake_secrets.py "$A2VM_COLLECTORS" --out "$I" --read-token "$I/deployed-read-token"
        rm -f "$I/deployed-read-token"
        kubectl -n "$NS" create secret generic a2vm-intake --from-file=digests="$I/digests" --dry-run=client -o yaml | kubectl apply -f -
        READ_TOKEN="$I/detect-read-token"
        INTAKE="--set intake.enabled=true --set-file intake.collectors=$A2VM_COLLECTORS --set intake.digestsSecret=a2vm-intake"
        INTAKE="$INTAKE --set intake.digestsChecksum=$(sha256sum "$I/digests" | cut -d' ' -f1) --set collect.mode=${A2VM_COLLECT_MODE:-intake}"
        # The push endpoint for the collectors outside the cluster, open to their addresses only.
        # (a values file with an empty `intake:` would drop the chart's defaults: written only with a host)
        if [ -n "${A2VM_INTAKE_HOST:-}" ]; then
          printf 'intake:\n  ingress:\n    enabled: true\n    host: "%s"\n' "$A2VM_INTAKE_HOST" > "$I/values.yaml"
          if [ -n "${A2VM_INTAKE_INGRESS_CLASS:-}" ]; then printf '    className: "%s"\n' "$A2VM_INTAKE_INGRESS_CLASS" >> "$I/values.yaml"; fi
          if [ -n "${A2VM_INTAKE_TLS_SECRET:-}" ]; then printf '    tlsSecret: "%s"\n' "$A2VM_INTAKE_TLS_SECRET" >> "$I/values.yaml"; fi
          if [ -n "${A2VM_INTAKE_INGRESS_CONTROLLER:-}" ]; then printf '    controller: "%s"\n' "$A2VM_INTAKE_INGRESS_CONTROLLER" >> "$I/values.yaml"; fi
          if [ -n "${A2VM_INTAKE_CLUSTER_ISSUER:-}" ]; then printf '    clusterIssuer: "%s"\n' "$A2VM_INTAKE_CLUSTER_ISSUER" >> "$I/values.yaml"; fi
          echo "    allowFrom:" >> "$I/values.yaml"
          for cidr in $(echo "${A2VM_INTAKE_ALLOW:-}" | tr ',' ' '); do printf '      - "%s"\n' "$cidr" >> "$I/values.yaml"; done
          INTAKE="$INTAKE -f $I/values.yaml"
        else
          echo "No A2VM_INTAKE_HOST: the detection service has no ingress (collectors inside the cluster only)"
        fi
      fi
    # Decision service (HLD D15 step 3, read side), unless A2VM_VERDICT_SERVICE=false: a publish token
    # (the daily run) and a read token (the analysts' tools), made once and kept from one deployment
    # to the next in the Secret a2vm-tenant; their digests in the Secret a2vm-verdict; none printed.
    - |
      VERDICT=""; V="$(mktemp -d)"; chmod 700 "$V"
      if [ "${A2VM_VERDICT_SERVICE:-true}" != "false" ]; then
        for k in verdict-publish-token verdict-read-token; do
          kubectl -n "$NS" get secret a2vm-tenant -o jsonpath="{.data.$k}" 2>/dev/null | base64 -d > "$V/$k" 2>/dev/null || true
          if [ "$(wc -c < "$V/$k")" -lt 32 ]; then od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > "$V/$k"; fi
        done
        printf 'publish %s\nread %s\n' "$(sha256sum < "$V/verdict-publish-token" | cut -d' ' -f1)" \
          "$(sha256sum < "$V/verdict-read-token" | cut -d' ' -f1)" > "$V/digests"
        kubectl -n "$NS" create secret generic a2vm-verdict --from-file=digests="$V/digests" --dry-run=client -o yaml | kubectl apply -f -
        VERDICT="--set verdict.enabled=true --set verdict.digestsSecret=a2vm-verdict"
        VERDICT="$VERDICT --set verdict.digestsChecksum=$(sha256sum "$V/digests" | cut -d' ' -f1)"
      else
        echo "A2VM_VERDICT_SERVICE=false: no decision service"
      fi
    # Conversational search (HLD §8), when A2VM_CHAT_HOST is set: Open WebUI and its tool server on
    # the decision service. Its session key, its first admin's password and the tools' token are made
    # once and kept in the Secret a2vm-tenant, the token's digest in the Secret a2vm-chat; none printed.
    - |
      CHAT=""; C="$(mktemp -d)"; chmod 700 "$C"
      if [ -n "${A2VM_CHAT_HOST:-}" ] && [ -n "$VERDICT" ]; then
        command -v python3 >/dev/null || apk add --no-cache -q python3
        for k in chat-secret-key chat-admin-password chat-tools-token; do
          kubectl -n "$NS" get secret a2vm-tenant -o jsonpath="{.data.$k}" 2>/dev/null | base64 -d > "$C/$k" 2>/dev/null || true
          if [ "$(wc -c < "$C/$k")" -lt 32 ]; then od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > "$C/$k"; fi
        done
        printf 'chat %s\n' "$(sha256sum < "$C/chat-tools-token" | cut -d' ' -f1)" > "$C/digests"
        kubectl -n "$NS" create secret generic a2vm-chat --from-file=digests="$C/digests" --dry-run=client -o yaml | kubectl apply -f -
        python3 .a2vm/deploy/chat/chat_values.py "$C/values.json"
        CHAT="--set chat.toolsDigestsSecret=a2vm-chat --set chat.toolsDigestsChecksum=$(sha256sum "$C/digests" | cut -d' ' -f1) -f $C/values.json"
      elif [ -n "${A2VM_CHAT_HOST:-}" ]; then
        echo "WARN A2VM_CHAT_HOST is set but the decision service is not: no chat"
      fi
    # The watch on Kubernetes (A2VM_RUN_MODE=kubernetes): the watch service and the watch CronJob. Its
    # run and read tokens are made once and kept in the Secret a2vm-tenant, their digests in the Secret
    # a2vm-via; the Word templates of the alerts (alert.docx, alert.<lang>.docx) go in the ConfigMap
    # a2vm-alert-template.
    - |
      WATCH=""; W="$(mktemp -d)"; chmod 700 "$W"
      if [ "$A2VM_RUN_MODE" = "kubernetes" ]; then
        for k in via-run-token via-read-token; do
          kubectl -n "$NS" get secret a2vm-tenant -o jsonpath="{.data.$k}" 2>/dev/null | base64 -d > "$W/$k" 2>/dev/null || true
          if [ "$(wc -c < "$W/$k")" -lt 32 ]; then od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > "$W/$k"; fi
        done
        printf 'run %s\nread %s\n' "$(sha256sum < "$W/via-run-token" | cut -d' ' -f1)" \
          "$(sha256sum < "$W/via-read-token" | cut -d' ' -f1)" > "$W/digests"
        kubectl -n "$NS" create secret generic a2vm-via --from-file=digests="$W/digests" --dry-run=client -o yaml | kubectl apply -f -
        WATCH="--set watch.enabled=true --set watch.digestsSecret=a2vm-via"
        WATCH="$WATCH --set watch.digestsChecksum=$(sha256sum "$W/digests" | cut -d' ' -f1)"
        WATCH="$WATCH --set watch.sendPipelineUrl=$CI_PROJECT_URL/-/pipelines/new --set watch.sendRef=$CI_DEFAULT_BRANCH"
        TPL=""; for t in templates/alert*.docx; do if [ -f "$t" ]; then TPL="$TPL --from-file=$(basename "$t")=$t"; fi; done
        if [ -n "$TPL" ]; then
          kubectl -n "$NS" create configmap a2vm-alert-template $TPL --dry-run=client -o yaml | kubectl apply -f -
          WATCH="$WATCH --set watch.alertTemplate=a2vm-alert-template"
        fi
        if [ -f contacts.yaml ]; then WATCH="$WATCH --set-file files.contacts=contacts.yaml"; fi
        if [ -f watch-sources.yaml ]; then WATCH="$WATCH --set-file files.watchSources=watch-sources.yaml"; fi
        echo "A2VM_RUN_MODE=kubernetes: the daily run and the watch run in $NS; the scheduled pipelines do nothing"
      fi
    # Sign-in of the analysts with the tenant's identity provider (v0.17.2), when A2VM_OIDC_ISSUER is
    # set: the chat and, with A2VM_ALERTS_HOST, the review page of the alerts behind oauth2-proxy. The
    # proxy's cookie key and the key of the page's forms are made once and kept in the Secret a2vm-tenant.
    - |
      SIGNIN=""; O="$(mktemp -d)"; chmod 700 "$O"
      if [ -n "${A2VM_OIDC_ISSUER:-}" ]; then
        command -v python3 >/dev/null || apk add --no-cache -q python3
        python3 .a2vm/deploy/chat/sign_in_values.py "$A2VM_RUN_MODE" "$O/values.json"
        for k in oidc-cookie-secret review-key; do
          kubectl -n "$NS" get secret a2vm-tenant -o jsonpath="{.data.$k}" 2>/dev/null | base64 -d > "$O/$k" 2>/dev/null || true
        done
        if [ "$(wc -c < "$O/oidc-cookie-secret")" -ne 32 ]; then od -An -tx1 -N16 /dev/urandom | tr -d ' \n' > "$O/oidc-cookie-secret"; fi
        if [ "$(wc -c < "$O/review-key")" -lt 64 ]; then od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > "$O/review-key"; fi
        SIGNIN="-f $O/values.json"
      elif [ -n "${A2VM_ALERTS_HOST:-}" ]; then
        echo "WARN A2VM_ALERTS_HOST is set but not A2VM_OIDC_ISSUER: no review page (the analysts must sign in)"
      fi
    # The tenant's secrets, from its CI/CD variables (File or text), into one Secret; never printed.
    - |
      umask 077; S="$(mktemp -d)"
      put() {
        if [ -z "$2" ]; then return 0; fi
        if [ -f "$2" ]; then cp "$2" "$S/$1"; else printf '%s' "$2" > "$S/$1"; fi
      }
      put ssh-key "${A2VM_SSH_KEY:-}"
      put llm-api-key "${LLM_API_KEY:-}"
      put gti-api-key "${GTI_API_KEY:-}"
      put gvm-user "${A2VM_GVM_USER:-}"
      put gvm-password "${A2VM_GVM_PASSWORD:-}"
      put reporting-dsn "${A2VM_REPORTING_DSN:-}"
      put reporting-ca "${A2VM_REPORTING_CA:-}"
      put gitlab-token "${A2VM_GITLAB_TOKEN:-}"
      put gitlab-ca "${CI_SERVER_TLS_CA_FILE:-}"
      put detect-read-token "$READ_TOKEN"
      put verdict-publish-token "$(cat "$V/verdict-publish-token" 2>/dev/null)"
      put verdict-read-token "$(cat "$V/verdict-read-token" 2>/dev/null)"
      put chat-secret-key "$(cat "$C/chat-secret-key" 2>/dev/null)"
      put chat-admin-password "$(cat "$C/chat-admin-password" 2>/dev/null)"
      put chat-tools-token "$(cat "$C/chat-tools-token" 2>/dev/null)"
      put via-run-token "$(cat "$W/via-run-token" 2>/dev/null)"
      put via-read-token "$(cat "$W/via-read-token" 2>/dev/null)"
      put smtp-password "${A2VM_SMTP_PASSWORD:-}"
      put graph-client-secret "${A2VM_GRAPH_CLIENT_SECRET:-}"
      if [ -n "$SIGNIN" ]; then
        put oidc-client-secret "${A2VM_OIDC_CLIENT_SECRET:-}"
        put oidc-ca "${A2VM_OIDC_CA:-}"
        put oidc-cookie-secret "$(cat "$O/oidc-cookie-secret" 2>/dev/null)"
        put review-key "$(cat "$O/review-key" 2>/dev/null)"
      fi
      kubectl -n "$NS" create secret generic a2vm-tenant --from-file="$S" --dry-run=client -o yaml | kubectl apply -f -
      echo "secret a2vm-tenant: $(ls "$S" | tr '\n' ' ')"
      rm -rf "$S"
    # A private registry: a deploy token with read_registry (A2VM_REGISTRY_USER, A2VM_REGISTRY_PASSWORD).
    - |
      PULL=""
      if [ -n "${A2VM_REGISTRY_USER:-}" ] && [ -n "${A2VM_REGISTRY_PASSWORD:-}" ]; then
        kubectl -n "$NS" create secret docker-registry a2vm-registry --docker-server="${A2VM_REGISTRY:-$CI_REGISTRY}" \
          --docker-username="$A2VM_REGISTRY_USER" --docker-password="$A2VM_REGISTRY_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
        PULL="--set image.pullSecret=a2vm-registry"
      fi
    # Non-secret settings handed to the run.
    - |
      ENVF="$(mktemp)"; echo "env:" > "$ENVF"
      for v in A2VM_LLM_ENABLED A2VM_LLM_BASE_URL A2VM_LLM_MODEL A2VM_GTI_ENABLED A2VM_EXTERNAL_PROJECT \
          A2VM_MAIL_FROM A2VM_MAIL_TRANSPORT A2VM_SMTP_HOST A2VM_SMTP_PORT A2VM_SMTP_TLS A2VM_SMTP_USER \
          A2VM_GRAPH_TENANT_ID A2VM_GRAPH_CLIENT_ID A2VM_GRAPH_SENDER A2VM_ANALYST_TO A2VM_SOURCE_FAILURES; do
        eval "val=\"\${$v:-}\""
        if [ -n "$val" ]; then printf '  %s: "%s"\n' "$v" "$val" >> "$ENVF"; fi
      done
      printf '  A2VM_SERVER_URL: "%s"\n' "${A2VM_SERVER_URL:-$CI_SERVER_URL}" >> "$ENVF"
    - |
      FILES="--set-file files.profile=$A2VM_PROFILE"
      if [ -f "$A2VM_TARGETS" ]; then FILES="$FILES --set-file files.targets=$A2VM_TARGETS"; fi
      if [ -f settings.yaml ]; then FILES="$FILES --set-file files.settings=settings.yaml"; fi
      helm upgrade --install a2vm .a2vm/deploy/charts/a2vm-tenant -n "$NS" \
        --set tenant="$(echo "$CI_PROJECT_NAME" | tr 'A-Z_' 'a-z-')" \
        --set image.registry="${A2VM_IMAGE_REGISTRY:-$CI_REGISTRY/$A2VM_PROJECT}" \
        --set image.tag="$A2VM_REF" \
        --set secret.name=a2vm-tenant \
        --set daily.schedule="${A2VM_K8S_SCHEDULE:-45 5 * * *}" \
        $PULL $FILES $INTAKE $VERDICT $CHAT $WATCH $SIGNIN -f "$ENVF"
      rm -rf "$I" "$V" "$C" "$W" "$O"
      kubectl -n "$NS" get cronjob,pvc
      if [ -n "$INTAKE" ]; then kubectl -n "$NS" get deployment,service,ingress -l app.kubernetes.io/component=detect; fi
      if [ -n "$VERDICT" ]; then kubectl -n "$NS" get deployment,service -l app.kubernetes.io/component=verdict; fi
      if [ -n "$CHAT" ]; then kubectl -n "$NS" get deployment,ingress -l 'app.kubernetes.io/component in (chat,tools)'; fi
      if [ -n "$WATCH" ]; then kubectl -n "$NS" get deployment,cronjob -l 'app.kubernetes.io/component in (via,watch)'; fi
      if [ -n "$SIGNIN" ] && [ -n "${A2VM_ALERTS_HOST:-}" ]; then kubectl -n "$NS" get deployment,ingress -l 'app.kubernetes.io/component in (review,send)'; fi

# Exit code 3 = collection incomplete: the job shows as a warning and the pipeline goes on with
# what was collected (plus the declared inventory).
collect:
  extends: .data
  stage: collect
  tags: ["$A2VM_COLLECT_TAG"]
  needs: [validate]
  allow_failure:
    exit_codes: [3]
  artifacts:
    when: always
    paths: [work/]
    expire_in: 7 days
  script:
    - mkdir -p work/detect
    - |
      rc=0
      if [ ! -f "$A2VM_TARGETS" ]; then
        echo "No $A2VM_TARGETS: no scanner collection, declared inventory only"
      else
        NO_SSH=""
        if [ -z "${A2VM_SSH_KEY:-}" ]; then
          echo "No A2VM_SSH_KEY: SSH targets skipped (OpenVAS scan only, if configured)"; NO_SSH="--no-ssh"
        else
          # Normalise the key pasted in GitLab: no CR, a final newline (OpenSSH rejects the key otherwise).
          mkdir -p ~/.ssh && umask 077
          tr -d '\r' < "$A2VM_SSH_KEY" | sed -e '$a\' > ~/.ssh/vulnops_scan
          if ! ssh-keygen -y -f ~/.ssh/vulnops_scan > /dev/null 2>&1; then
            echo "A2VM_SSH_KEY is not a usable private key: paste the whole file, from the BEGIN line to the END line"
            exit 3
          fi
          echo "scan key: $(ssh-keygen -l -f ~/.ssh/vulnops_scan)"
        fi
        detect collect "$A2VM_TARGETS" $NO_SSH --raw work/scans --out work/detect || rc=$?
        # Raw outputs are not kept: Trivy JSON runs to hundreds of MB; what matters is in work/detect.
        rm -rf work/scans
      fi
      # The client's external scan (its collection-only project), when this project names it.
      if [ -n "${A2VM_EXTERNAL_PROJECT:-}" ]; then
        detect external "$A2VM_PROFILE" --project "$A2VM_EXTERNAL_PROJECT" --out work/detect || rc=$?
      fi
      du -sh work/* 2>/dev/null || true
      if [ "$rc" -ne 0 ]; then exit 3; fi

via:
  extends: .data
  stage: via
  needs: [collect]
  script:
    - |
      ARGS=""
      for c in ${TRIAGE_CVES:-}; do ARGS="$ARGS --cve $c"; done
      if [ -z "$ARGS" ]; then ARGS="--since ${TRIAGE_SINCE:-26h}"; fi
      via collect --settings "$SETTINGS" --detect work/detect --out work/records.json $ARGS

detect:
  extends: .data
  stage: detect
  needs: [via]
  script:
    - detect inventory "$A2VM_PROFILE" --settings "$SETTINGS" --records work/records.json --out work/detect

assets:
  extends: .data
  stage: assets
  needs: [detect]
  script:
    - verdict assets build "$A2VM_PROFILE" --detect work/detect --out work/assets

triage:
  extends: .data
  stage: triage
  needs: [assets]
  # The inventory is also left in the runner cache, where the watch (every 10 minutes) reads it:
  # the artifacts API only answers for the latest pipeline, which is nearly always a watch.
  cache:
    - {key: pip, paths: [.pip-cache/]}
    - {key: sources, paths: [.cache/]}
    - {key: inventory, paths: [work/assets/], policy: push}
  script:
    - verdict run "$A2VM_PROFILE" --settings "$SETTINGS" --records work/records.json --assets work/assets --out output
  artifacts:
    name: "triage-$CI_PROJECT_NAME-$CI_PIPELINE_ID"
    paths: [output/, work/assets/]
    expire_in: 30 days

# The run's reporting dataset into the reporting database (dashboards read it, never GitLab), when
# the project has A2VM_REPORTING_DSN (a postgresql:// URI, masked; or a File variable) and, to verify
# the server, A2VM_REPORTING_CA (the server's certificate, File variable or pasted text).
# Exit code 3: database unreachable or refused (warning; the next run publishes again).
publish:
  extends: .a2vm
  stage: publish
  needs: [triage]
  rules:
    - if: $A2VM_JOB == "watch" || $VULNOPS_JOB == "watch"
      when: never
    - if: $A2VM_REPORTING_DSN && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
  allow_failure:
    exit_codes: [3]
  script:
    - verdict publish output/*/reporting.json

# -- Watch mode: schedule every 10 minutes with the variable A2VM_JOB=watch -------------------
# The state (what was already seen) lives in the GitLab cache; without it, a run only records the
# current state and alerts on nothing. Exit code 3: a source or the mail failed (warning).
watch:
  extends: .a2vm
  stage: watch
  rules:
    - if: $A2VM_RUN_MODE == "kubernetes"
      when: never
    - if: ($A2VM_JOB == "watch" || $VULNOPS_JOB == "watch") && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
  resource_group: watch
  cache:
    - {key: pip, paths: [.pip-cache/]}
    - {key: sources, paths: [.cache/]}  # CVE records and GTI answers, shared with the daily run
    - {key: watch-state, paths: [.watch/], when: always}
    - {key: inventory, paths: [work/assets/], policy: pull}  # left by the daily triage job
  allow_failure:
    exit_codes: [3]
  script:
    - if [ -f watch-sources.yaml ]; then export SOURCES=watch-sources.yaml; else export SOURCES=.a2vm/config/watch-sources.yaml; fi
    - via watch "$A2VM_PROFILE" --settings "$SETTINGS" --sources "$SOURCES" --state .watch/state.json --out alerts
  artifacts:
    when: always
    paths: [alerts/]
    expire_in: 14 days

# The analyst's validation: running this job mails the alerts of this pipeline to the client. To send
# only some of them, set A2VM_SEND_ONLY in the job's form before ▶: their numbers in the analysts'
# mail (1 3) or their ids. The job writes alerts/sent.json and adds its events to the alerts journal.
send-alerts:
  extends: .a2vm
  stage: send
  needs: [watch]
  rules:
    - if: $A2VM_RUN_MODE == "kubernetes"
      when: never
    - if: ($A2VM_JOB == "watch" || $VULNOPS_JOB == "watch") && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
      when: manual
      allow_failure: true
  resource_group: watch   # one writer of the alerts journal at a time
  cache:
    - {key: pip, paths: [.pip-cache/]}
    - {key: watch-state, paths: [.watch/], when: always}
  script:
    # The analysts' edits are committed after this pipeline started: read them from the branch head.
    - |
      if git fetch -q --depth 1 origin "$CI_DEFAULT_BRANCH" && git checkout -q FETCH_HEAD -- edits 2>/dev/null; then
        echo "edits/ read from $CI_DEFAULT_BRANCH ($(git rev-parse --short FETCH_HEAD)): $(ls edits | wc -l) file(s)"
      else
        echo "no edits/ on $CI_DEFAULT_BRANCH: the sheets are sent as drafted"
      fi
    # alerts.attach: [pdf] -> the PDF is made from the Word sheet now: LibreOffice and fonts metric-
    # compatible with Calibri, Cambria, Arial and Times (installed in this manual job only).
    - |
      if python3 -c "import sys, yaml; a = (yaml.safe_load(open(sys.argv[1])) or {}).get('alerts') or {}; sys.exit(0 if 'pdf' in (a.get('attach') or []) else 1)" "$A2VM_PROFILE"; then
        echo "alerts.attach: pdf -> installing LibreOffice"
        apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation >/dev/null
      fi
    - via send "$A2VM_PROFILE" --alerts alerts --journal .watch/alerts-log.jsonl --edits edits
  artifacts:
    when: always
    paths: [alerts/sent.json, alerts/alerts-log.jsonl, alerts/pdf/]
    expire_in: 90 days

# The analyst's validation on Kubernetes (A2VM_RUN_MODE=kubernetes): the analysts' mail links to a new
# pipeline of this project with A2VM_JOB=send and A2VM_SEND_ONLY=<alert id> filled in; "Run pipeline"
# is the validation. The job hands the alert ids and this project's edits/ to a send Job in the
# tenant's namespace (the deployed release's values), waits for it and shows its log.
send-alerts-k8s:
  stage: send
  image: alpine:3.22
  tags: ["$A2VM_RUNNER_TAG"]
  needs: []
  rules:
    - if: $A2VM_RUN_MODE == "kubernetes" && $A2VM_JOB == "send" && $CI_PIPELINE_SOURCE == "web" && $A2VM_K8S_CONTEXT
  resource_group: watch
  cache: []
  script:
    - apk add --no-cache -q git helm kubectl
    - if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi
    - BASE="${A2VM_SERVER_URL:-${CI_SERVER_PROTOCOL}://${CI_SERVER_HOST}:${CI_SERVER_PORT}}"
    - git -c advice.detachedHead=false clone -q --depth 1 --branch "$A2VM_REF"
        "${BASE%%://*}://gitlab-ci-token:${CI_JOB_TOKEN}@${BASE#*://}/${A2VM_PROJECT}.git" .a2vm
    - kubectl config use-context "$A2VM_K8S_CONTEXT"
    - if [ -n "${A2VM_K8S_CA:-}" ]; then kubectl config set-cluster gitlab --certificate-authority="$A2VM_K8S_CA"; fi
    - NS="${A2VM_K8S_NAMESPACE:-a2vm-$(echo "$CI_PROJECT_NAME" | tr 'A-Z_' 'a-z-')}"
    - |
      ONLY="$(printf '%s' "${A2VM_SEND_ONLY:-}" | tr ',' ' ' | tr -cd 'A-Za-z0-9._ -')"
      JOB="send-$CI_PIPELINE_ID"; EDITS=""; V="$(mktemp -d)"
      echo "alerts to send: ${ONLY:-the pending alerts of the latest watch}"
      if [ -d edits ] && [ -n "$(ls edits 2>/dev/null)" ]; then
        kubectl -n "$NS" create configmap "a2vm-edits-$CI_PIPELINE_ID" --from-file=edits/ --dry-run=client -o yaml | kubectl apply -f -
        EDITS="--set watch.send.editsConfigMap=a2vm-edits-$CI_PIPELINE_ID"
        echo "edits/: $(ls edits | wc -l) file(s) handed to the send job"
      fi
      helm get values a2vm -n "$NS" -o yaml > "$V/values.yaml"
      helm template a2vm .a2vm/deploy/charts/a2vm-tenant -n "$NS" -f "$V/values.yaml" \
        --set watch.send.job="$JOB" --set-string watch.send.only="$ONLY" $EDITS --show-only templates/watch.yaml \
        | kubectl -n "$NS" apply -f -
      rc=1
      for _ in $(seq 120); do
        state="$(kubectl -n "$NS" get job "$JOB" -o jsonpath='{.status.succeeded}/{.status.failed}')"
        case "$state" in 1/*) rc=0; break ;; */1) break ;; esac
        sleep 5
      done
      kubectl -n "$NS" logs "job/$JOB" --tail=-1 || true
      if [ -n "$EDITS" ]; then kubectl -n "$NS" delete configmap "a2vm-edits-$CI_PIPELINE_ID" --ignore-not-found; fi
      rm -rf "$V"
      if [ "$rc" -ne 0 ]; then echo "the send job did not succeed: see its log above"; exit 1; fi

# Checks the mail settings (A2VM_MAIL_FROM, SMTP or Graph, A2VM_ANALYST_TO): Build > Pipelines >
# New pipeline (or ▶ on a schedule), then ▶ on this job. To another address: A2VM_TEST_TO in its form.
test-mail:
  extends: .a2vm
  stage: send
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"
      when: manual
      allow_failure: true
  cache:
    - {key: pip, paths: [.pip-cache/]}
  script:
    - via test-mail ${A2VM_TEST_TO:+--to $A2VM_TEST_TO}
