[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detect"
version = "0.13.3"
description = "Pillar 2 (Vulnerability Detection): asset and vulnerability observations (inventory matching, scanner connectors)."
requires-python = ">=3.11"
license = {text = "LicenseRef-a2vm-proprietary"}
dependencies = ["a2vm", "defusedxml>=0.7"]

[project.optional-dependencies]
openvas = ["python-gvm>=26"]

[project.scripts]
detect = "detect.cli:main"

# Offered to the other pillars through the a2vm extension points (a2vm.extensions).
[project.entry-points."a2vm.asset_matcher"]
detect = "detect.inventory:InventoryScanner"

[tool.setuptools.packages.find]
where = ["src"]
