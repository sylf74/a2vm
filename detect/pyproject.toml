[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnops-detect"
version = "0.8.5"
description = "vulnops detection stage: produces findings (inventory matching, scanner connectors)."
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = ["vulnops-core", "defusedxml>=0.7"]

[project.optional-dependencies]
openvas = ["python-gvm>=26"]

[project.scripts]
vulnops-detect = "vulnops.detect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

