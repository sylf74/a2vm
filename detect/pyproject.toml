[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnops-detect"
version = "0.5.0"
description = "vulnops detection stage: produces findings (inventory matching, scanner connectors)."
requires-python = ">=3.11"
dependencies = ["vulnops-core"]

[project.scripts]
vulnops-detect = "vulnops.detect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

