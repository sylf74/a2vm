# Tenant pipeline: everything comes from the NGVM code project, at a fixed version. Replace the
# project path with the path of the NGVM code project in your GitLab (and set the CI/CD variable
# NGVM_PROJECT to the same path, on the group of the tenants).
include:
  - project: group/subgroup/ngvm
    ref: v0.24.0
    file: templates/client-pipeline.yml

variables:
  NGVM_REF: v0.24.0  # keep equal to the include ref
  NGVM_RUN_MODE: gitlab   # kubernetes: the daily run and the watch in the cluster (docs/kubernetes.md §4)
