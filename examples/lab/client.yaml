# Lab profile (example): fictitious hosts and addresses, real products.
# Linux hosts are discovered by the scanners (targets.yaml); the rules below give
# them their exposure and criticality. Appliances and Windows servers, which the scanners do not
# cover, are declared as assets and matched against the CVE records by product and version.
# Anything not covered falls back to the worst case (open, essential), flagged in reports.

schema_version: 2
client:
  id: lab
  name: Lab
  updated: 2026-10-11

# External scan (optional): its collection-only project is named by A2VM_EXTERNAL_PROJECT; its
# hosts join the internal assets below and make them `open` (docs/openvas.md, section 6).
# external:
#   client: lab-external
#   max_age_days: 8
# published:
#   - endpoint: "www.lab.example:443"
#     asset: edge01
#     behind: [node08]
#     zone: dmz

# Priorities and SLA of the client (v0.21.0, docs/sla.md): BOD 26-04 is the default; the first rule
# that matches a decision gives its priority and its delay, from the day it enters that priority. The
# level (ACT, ATTEND, TRACK) does not change. Without this section, BOD 26-04 only.
sla:
  calendar: business
  holidays: FR
  timezone: Europe/Paris
  rules:
    - {priority: P0, days: 2, calendar: calendar, when: {kev: true}}
    - {priority: P1, days: 5, when: {level: ACT, exposure: open}}
    - {priority: P2, days: 10, when: {level: ACT, exposure: controlled}}
    - {priority: P3, days: 15, when: {level: ACT}}
    - {priority: P4, days: 30, when: {level: ATTEND, exposure: open}}
    - {priority: P5, days: 90, when: {level: ATTEND}}

alerts:
  recipients: [admin@lab.example]
  level: urgent
  watchlist: ["Microsoft Exchange Server"]

rules:
  # An image takes the owner, exposure and zone of the host it is scanned on (v0.23.13); a rule
  # gives it its own: a glob on the image reference, alone.
  # - {image: "registry.lab.example/shop/*", set: {owner: shop-team}, description: the shop's images}
  - description: reverse proxy published on the Internet (443)
    hostname: edge01
    set: {exposure: open, mission_prevalence: essential, public_wellbeing_impact: minimal, owner: lab-admin}
  - description: hypervisors
    hostname: "node*"
    set: {exposure: controlled, mission_prevalence: essential, public_wellbeing_impact: minimal, owner: lab-admin}
  - description: A2VM lab
    hostname: "poc-*"
    set: {exposure: controlled, mission_prevalence: support, public_wellbeing_impact: minimal, owner: lab-admin}
  - description: GitLab
    hostname: gitlab
    set: {exposure: controlled, mission_prevalence: support, public_wellbeing_impact: minimal, owner: lab-admin}

assets:
  - id: exchange
    description: Exchange Server 2019, published on the Internet through edge01
    vendor: Microsoft
    product: Exchange Server 2019
    product_aliases: ["Microsoft Exchange Server 2019", "Exchange Server"]
    exposure: open
    mission_prevalence: essential
    public_wellbeing_impact: minimal
    owner: lab-admin
  - id: active-directory
    description: Active Directory domain controller (Windows Server)
    vendor: Microsoft
    product: Windows Server
    exposure: controlled
    mission_prevalence: essential
    public_wellbeing_impact: minimal
    owner: lab-admin
  - id: vyos
    description: VyOS router and firewall (Internet edge)
    vendor: VyOS
    product: VyOS
    exposure: open
    mission_prevalence: essential
    public_wellbeing_impact: minimal
    owner: lab-admin
  - id: nas
    description: NAS (Synology DSM)
    vendor: Synology
    product: DiskStation Manager
    product_aliases: ["DSM"]
    exposure: controlled
    mission_prevalence: support
    public_wellbeing_impact: minimal
    owner: lab-admin
  - id: home-assistant
    description: Home Assistant
    vendor: Home Assistant
    product: Home Assistant Core
    vendor_aliases: ["home-assistant"]
    product_aliases: ["Home Assistant", "core"]
    exposure: controlled
    mission_prevalence: support
    public_wellbeing_impact: minimal
    owner: lab-admin
