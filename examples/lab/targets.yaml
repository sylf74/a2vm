# Read-only SSH collection targets for the lab client (see docs/scanning.md).
# Adapt host names and addresses; `method` picks the scanner run on the host:
#   trivy           Ubuntu, Rocky/RHEL/CentOS 8-9, Debian... (OS packages; optional container images)
#   dnf-updateinfo  Rocky / RHEL 10 and any dnf-based host Trivy does not cover
# `ip` / `ips`: addresses of the host, used to reconcile it with other sources (one asset per host).
client: lab
ssh:
  user: vulnops                       # dedicated unprivileged account on every target
  identity_file: ~/.ssh/vulnops_scan  # in CI: written from the A2VM_SSH_KEY variable
  timeout_seconds: 600
targets:
  - {host: gitlab.lab.example, ip: 192.0.2.102, method: trivy}                 # Ubuntu 24.04
  - {host: poc-llm01.lab.example, ip: 192.0.2.103, method: trivy, images: ["vllm/vllm-openai:latest"]}
  - {host: poc-runner01.lab.example, ip: 192.0.2.104, method: trivy}       # Ubuntu 24.04
  - {host: node00.lab.example, method: trivy}                                   # Rocky 9.8
  - {host: node01.lab.example, method: dnf-updateinfo}                          # Rocky 10.2
  - {host: node02.lab.example, ip: 192.0.2.75, ips: [192.0.2.195, 192.0.2.197], method: dnf-updateinfo}  # Rocky 10.1
  - {host: node03.lab.example, method: trivy}                                   # CentOS Linux 8 (end of life)
  - {host: node04.lab.example, method: trivy}                                   # Rocky 9.5
  - {host: node08.lab.example, method: dnf-updateinfo}                          # Rocky 10.1
  - {host: edge01.lab.example, ip: 198.51.100.4, method: dnf-updateinfo}           # Rocky 10.2, Internet-facing
# Optional network scan by a Greenbone OpenVAS scanner (docs/openvas.md):
# openvas:
#   gmp: tls://scanner.lab.example:9390
#   hosts: [192.0.2.0/24]
