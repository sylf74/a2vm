# Client project pipeline: everything comes from the NGVM code project (vulnops/ngvm), at a fixed version.
include:
  - project: vulnops/ngvm
    ref: v0.25.0
    file: templates/client-pipeline.yml

variables:
  NGVM_REF: v0.25.0  # keep equal to the include ref
  NGVM_RUN_MODE: gitlab   # kubernetes: the daily run and the watch in the cluster (docs/kubernetes.md §4)
