# Example client profile — copy to client.yaml in the client's project and adapt.
# Schema: a2vm/src/a2vm/schemas/client_profile.schema.json (checked in CI).
#
# Field guide (CISA SSVC wording):
#   exposure                 SSVC System Exposure. open = reachable from the internet or another widely
#                            accessible network; controlled = networked, access restricted by measures
#                            that reliably interrupt an attack; small = local or isolated network
#                            (the former internet / internal / isolated are still read, with a warning)
#   zone                     dmz, lan, ot...; a zone of `zones` (below) places the asset in the graph of its
#                            exposure (v0.24.0), any other label only groups it in reports
#   mission_prevalence       minimal | support | essential   (role of the asset in the client's mission)
#   public_wellbeing_impact  minimal | material | irreversible (physical, psychological, financial harm)
#   versions                 deployed versions; leave empty if unknown (rows are then flagged for review)

schema_version: 1
client:
  id: example-client
  name: Example Client
  updated: 2026-10-10
  # delivery_file: https://gitlab/voc/delivery-files/-/blob/main/clients/example-client.md

assets:
  - id: edge-firewalls
    description: Internet-facing firewalls with GlobalProtect VPN portal
    vendor: Palo Alto Networks
    product: PAN-OS
    cpe: "cpe:2.3:o:paloaltonetworks:pan-os"
    versions: ["11.1.2-h1"]
    exposure: open
    mission_prevalence: essential
    public_wellbeing_impact: minimal
    owner: network-team

  - id: hr-portal
    description: HR self-service portal (internal)
    vendor: Example Soft
    product: Example HR Portal
    product_aliases: ["HR Portal"]
    versions: ["4.2.1"]
    exposure: controlled
    mission_prevalence: support
    public_wellbeing_impact: minimal
    owner: apps-team

  - id: vpn-gateways
    description: Remote-access gateways for field staff
    vendor: Acme Networks
    product: SecureGate OS
    versions: ["7.2.1", "7.0.9"]
    exposure: open
    mission_prevalence: essential
    public_wellbeing_impact: material
    owner: network-team

  - id: build-servers
    description: CI build servers (isolated network)
    vendor: Example Soft
    product: BuildBox
    exposure: small
    mission_prevalence: minimal
    public_wellbeing_impact: minimal
    owner: devops-team

# Zones and flows (v0.24.0, optional): the networks of each zone and the flows the client allows.
# An intention: what the scanners observe comes first, and the differences are exposure gaps.
# zones:
#   - {id: dmz, networks: [192.0.2.0/26]}
#   - {id: lan, networks: [192.0.2.64/26]}
#   - {id: vpn, networks: [198.51.100.0/24], open: true}   # widely accessible: exposure open
# flows:
#   - {from: internet, to: dmz, ports: [443]}
#   - {from: lan, to: dmz, ports: [443, 5432]}
# off_premises_days: 7      # a machine seen outside every network stays open this long
