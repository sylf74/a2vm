[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnops-assets"
version = "0.8.2"
description = "vulnops assets stage: multi-tenant asset inventory consolidated from detection observations."
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = ["vulnops-core"]

[project.scripts]
vulnops-assets = "vulnops.assets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
