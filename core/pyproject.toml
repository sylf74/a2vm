[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnops-core"
version = "0.9.0"
description = "vulnops common data model, exchange files, settings, client profiles and LLM client."
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = ["httpx>=0.27", "PyYAML>=6.0", "jsonschema>=4.20"]

[project.scripts]
vulnops-profiles = "vulnops.core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"vulnops.core" = ["schemas/*.json"]
