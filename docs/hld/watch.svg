<svg viewBox="0 0 1200 500" role="img" aria-label="The watch: sources reach the shared intelligence service once; the radar of the watch team turns them into events and publishes the validated ones to a feed; each client&#x27;s watch matches the records and the feed with its own assets." xmlns="http://www.w3.org/2000/svg">
<style>svg{--bg:#f5f6f4;--fg:#1d2329;--muted:#5d6771;--edge:#56606b;--k8s:#eaeef3;--k8s-line:#9fb0c4;--ns-line:#b7c3d0;--client:#f0ece4;--client-line:#c8bca6;--ext:#ffffff;--ext-line:#b9c0c7;--p1:#0f7f74;--p1-bg:#e1f2ef;--p2:#a96a12;--p2-bg:#f8ecd9;--p3:#2c58a8;--p3-bg:#e3eaf7;--p4:#a83b65;--p4-bg:#f6e3ea;--db-bg:#e9e6f3;--db:#6a5aa6;--label-bg:#f5f6f4}@media (prefers-color-scheme: dark){svg{--bg:#14181c;--fg:#e4e8ec;--muted:#9aa5b0;--edge:#a3adb8;--k8s:#1b2229;--k8s-line:#3d4c5c;--ns-line:#364350;--client:#221f1a;--client-line:#4f4636;--ext:#1f252b;--ext-line:#45505b;--p1:#4cc2b4;--p1-bg:#12302c;--p2:#e0a650;--p2-bg:#33260f;--p3:#7fa4ea;--p3-bg:#172640;--p4:#e588ab;--p4-bg:#3a1a27;--db-bg:#252038;--db:#a597de;--label-bg:#1b2229}}svg>rect.page{fill:var(--bg)}svg { font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; color: var(--edge); }
.r-k8s { fill: var(--k8s); stroke: var(--k8s-line); stroke-width: 1.5; }
.r-ns { fill: none; stroke: var(--ns-line); stroke-width: 1.2; stroke-dasharray: 6 4; }
.r-ext { fill: none; stroke: var(--ext-line); stroke-width: 1.2; }
.r-client { fill: var(--client); stroke: var(--client-line); stroke-width: 1.2; }
.box { stroke-width: 1.5; }
.b-ext { fill: var(--ext); stroke: var(--ext-line); }
.b-p1 { fill: var(--p1-bg); stroke: var(--p1); }
.b-p2 { fill: var(--p2-bg); stroke: var(--p2); }
.b-p3 { fill: var(--p3-bg); stroke: var(--p3); }
.b-p4 { fill: var(--p4-bg); stroke: var(--p4); }
.b-db { fill: var(--db-bg); stroke: var(--db); }
.t-region { fill: var(--fg); font-size: 13px; font-weight: 600; }
.t-region-sub { fill: var(--muted); font-size: 12px; font-weight: 400; }
.t-title { fill: var(--fg); font-size: 13px; font-weight: 600; }
.t-line { fill: var(--fg); font-size: 12px; }
.t-mono { fill: var(--muted); font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; }
.t-chip { fill: var(--fg); font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.t-strip { fill: var(--muted); font-size: 12px; }
.t-edge { fill: var(--fg); font-size: 11px; }
.t-note { fill: var(--muted); font-size: 12.5px; }
.lbl-bg { fill: var(--label-bg); opacity: .92; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
.edge.thin { stroke-width: 1.1; }
.edge.dashed { stroke-dasharray: 5 4; }
.halo { fill: none; stroke: var(--k8s); stroke-width: 6; }
.arrowhead { fill: var(--edge); }
</style>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs>
<rect class="page" x="0" y="0" width="1200" height="500"/>
<rect x="560" y="14" width="630" height="132" rx="10" class="r-ns"/>
<text x="574" y="34" class="t-region">Watch team<tspan dx="10" class="t-region-sub">namespace ngvm-via</tspan></text>
<rect x="560" y="324" width="630" height="168" rx="10" class="r-ns"/>
<text x="574" y="482" class="t-region">Each client<tspan dx="10" class="t-region-sub">namespace ngvm-&lt;tenant&gt;</tspan></text>
<polyline points="230,235 290,235" class="edge" marker-end="url(#a2)"/>
<polyline points="526,190 546,190 546,89 576,89" class="halo"/>
<polyline points="526,190 546,190 546,89 576,89" class="edge" marker-end="url(#a2)"/>
<polyline points="756,89 788,89" class="edge" marker-end="url(#a2)"/>
<polyline points="968,89 1000,89" class="edge" marker-end="url(#a2)"/>
<polyline points="1088,132 1088,166 526,166" class="halo"/>
<polyline points="1088,132 1088,166 526,166" class="edge" marker-end="url(#a2)"/>
<polyline points="526,280 546,280 546,400 576,400" class="halo"/>
<polyline points="526,280 546,280 546,400 576,400" class="edge" marker-end="url(#a2)"/>
<polyline points="640,360 640,296 526,296" class="halo"/>
<polyline points="640,360 640,296 526,296" class="edge dashed" marker-end="url(#a2)"/>
<polyline points="756,408 788,408" class="edge" marker-end="url(#a2)"/>
<polyline points="968,408 1000,408" class="edge" marker-end="url(#a2)"/>
<rect x="20" y="160" width="210" height="150" rx="6" class="box b-ext"/>
<text x="30" y="179" class="t-title">Sources</text>
<text x="30" y="194" class="t-mono">every 10 min</text>
<text x="30" y="209" class="t-line">CERT-FR, CISA KEV</text>
<text x="30" y="224" class="t-line">vendor advisories</text>
<text x="30" y="239" class="t-line">research and news</text>
<text x="30" y="254" class="t-line">GTI (optional)</text>
<rect x="290" y="160" width="236" height="150" rx="6" class="box b-p1"/>
<text x="300" y="179" class="t-title">Shared intelligence service</text>
<text x="300" y="194" class="t-mono">intel.v1</text>
<text x="300" y="209" class="t-line">records collected once</text>
<text x="300" y="224" class="t-line">feed: validated radar events</text>
<text x="300" y="239" class="t-line">technologies 48 h, anonymous</text>
<rect x="576" y="46" width="180" height="86" rx="6" class="box b-p1"/>
<text x="586" y="65" class="t-title">Radar</text>
<text x="586" y="80" class="t-line">items → events</text>
<text x="586" y="95" class="t-line">zero-day before its CVE</text>
<rect x="788" y="46" width="180" height="86" rx="6" class="box b-p1"/>
<text x="798" y="65" class="t-title">Magnitude</text>
<text x="798" y="80" class="t-line">deterministic score</text>
<text x="798" y="95" class="t-line">info 4 · urgent 7</text>
<rect x="1000" y="46" width="176" height="86" rx="6" class="box b-p1"/>
<text x="1010" y="65" class="t-title">Team validates</text>
<text x="1010" y="80" class="t-line">review page</text>
<text x="1010" y="95" class="t-line">Teams, mail</text>
<rect x="576" y="360" width="180" height="96" rx="6" class="box b-p1"/>
<text x="586" y="379" class="t-title">Client watch</text>
<text x="586" y="394" class="t-line">records and feed</text>
<text x="586" y="409" class="t-line">client&#x27;s own sources</text>
<rect x="788" y="360" width="180" height="96" rx="6" class="box b-p1"/>
<text x="798" y="379" class="t-title">Match own assets</text>
<text x="798" y="394" class="t-line">profile, inventory</text>
<text x="798" y="409" class="t-line">watchlist</text>
<rect x="1000" y="360" width="176" height="96" rx="6" class="box b-p1"/>
<text x="1010" y="379" class="t-title">Analyst validates</text>
<text x="1010" y="394" class="t-line">Word sheet</text>
<text x="1010" y="409" class="t-line">mail to client contacts</text>
<rect x="236" y="217" width="48" height="15" rx="3" class="lbl-bg"/>
<text x="260" y="228" text-anchor="middle" class="t-edge">collect</text>
<rect x="523" y="129" width="38" height="15" rx="3" class="lbl-bg"/>
<text x="528" y="140" text-anchor="start" class="t-edge">items</text>
<rect x="749" y="151" width="142" height="15" rx="3" class="lbl-bg"/>
<text x="820" y="162" text-anchor="middle" class="t-edge">published once validated</text>
<rect x="523" y="329" width="82" height="15" rx="3" class="lbl-bg"/>
<text x="528" y="340" text-anchor="start" class="t-edge">records, feed</text>
<rect x="560" y="279" width="180" height="15" rx="3" class="lbl-bg"/>
<text x="650" y="290" text-anchor="middle" class="t-edge">technologies watched, ≤ 2 a day</text>
<text x="1176" y="228" text-anchor="end" class="t-note">The radar never knows which client has what:</text>
<text x="1176" y="246" text-anchor="end" class="t-note">each client&#x27;s watch matches the events</text>
<text x="1176" y="264" text-anchor="end" class="t-note">with its own assets, urgent when the radar</text>
<text x="1176" y="282" text-anchor="end" class="t-note">said so.</text>
</svg>
