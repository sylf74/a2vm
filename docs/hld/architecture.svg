<text x="46" y="474" class="t-mono">detect agent</text>
<text x="46" y="489" class="t-line">SSH: Trivy, dnf updateinfo</text>
<text x="46" y="504" class="t-line">OpenVAS (Greenbone)</text>
<text x="46" y="519" class="t-line">iTop (CMDB), Wazuh (EDR)</text>
<text x="46" y="534" class="t-line">systemd timers, spool</text>
<rect x="20" y="656" width="250" height="78" rx="6" class="box b-ext"/>
<text x="30" y="675" class="t-title">iTop CMDB, Wazuh</text>
<text x="30" y="690" class="t-line">CMDB items, agents&#x27; packages</text>
<text x="30" y="705" class="t-line">read only</text>
<rect x="20" y="776" width="250" height="112" rx="6" class="box b-ext"/>
<text x="30" y="795" class="t-title">Cloud scanner</text>
<text x="30" y="810" class="t-line">Greenbone in containers</text>
<text x="30" y="825" class="t-line">runner tagged scan-cloud</text>
<text x="30" y="840" class="t-line">scans public addresses</text>
<rect x="334" y="206" width="236" height="118" rx="6" class="box b-p1"/>
<text x="344" y="225" class="t-title">Shared intelligence service</text>
<text x="344" y="240" class="t-mono">via intel-serve · intel.v1</text>
<text x="344" y="255" class="t-line">records collected once</text>
<text x="344" y="270" class="t-line">technologies 48 h, no identity</text>
<text x="344" y="285" class="t-line">feed of the radar&#x27;s events</text>
<rect x="600" y="206" width="230" height="118" rx="6" class="box b-p1"/>
<text x="610" y="225" class="t-title">Radar</text>
<text x="610" y="240" class="t-mono">watch CronJob, every 10 min</text>
<text x="610" y="255" class="t-line">items gathered into events</text>
<text x="610" y="270" class="t-line">magnitude: info 4, urgent 7</text>
<text x="610" y="285" class="t-line">zero-days before their CVE</text>
<rect x="860" y="206" width="248" height="118" rx="6" class="box b-p1"/>
<text x="870" y="225" class="t-title">Review page and sender</text>
