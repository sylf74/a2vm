<svg viewBox="0 0 1440 940" role="img" aria-label="Deployment of A2VM: GitLab deploys a namespace per client and the watch team&#x27;s namespace on Kubernetes; collectors and the cloud scanner bring detections in; tickets go to iTop." xmlns="http://www.w3.org/2000/svg">
