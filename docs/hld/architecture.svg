<text x="30" y="159" class="t-title">Public sources</text>
<text x="30" y="174" class="t-mono">read by the shared service</text>
<text x="30" y="189" class="t-line">CVE.org records, NVD</text>
<text x="30" y="204" class="t-line">CISA KEV, FIRST EPSS</text>
<text x="30" y="219" class="t-line">CERT-FR, vendor advisories</text>
<text x="30" y="234" class="t-line">Research and news sites</text>
<text x="30" y="249" class="t-line">Google TI (optional)</text>
