<svg viewBox="0 0 1500 800" role="img" aria-label="Several tenants on one cluster: a namespace per client with its own services, secrets and database; the watch team&#x27;s shared service and the portal are the only shared parts." xmlns="http://www.w3.org/2000/svg">
