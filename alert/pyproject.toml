[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnops-alert"
version = "0.8.4"
description = "vulnops watch mode: new CERT-FR, KEV and critical CVEs matched to each client, drafted as alerts for an analyst to validate and send."
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = ["vulnops-core", "vulnops-intel", "vulnops-detect", "vulnops-verdict"]

[project.scripts]
vulnops-alert = "vulnops.alert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
