# vulnops code project pipeline: quality checks only. No client data is ever processed here.
#
# Client pipelines run in the client projects (group vulnops/clients), which include
# templates/client-pipeline.yml at a fixed version (tag). See docs/deployment.md.
#
#   lint, test       every push and merge request
#   examples         the example profiles and targets are valid, and the offline demo runs
#   release          on a tag vX.Y.Z: checks that the packages carry that version

stages: [lint, test, examples, release]

default:
  image: python:3.12-slim
  interruptible: true
  cache: {key: pip, paths: [.pip-cache/]}

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

.install: &install
  - pip install --quiet -r requirements-dev.txt

lint:
  stage: lint
  script:
    - *install
    - ruff check .
    - ruff format --check .
    - python -c "import yaml; [yaml.safe_load(open(f)) for f in ('templates/client-pipeline.yml', 'examples/lab/.gitlab-ci.yml')]"

test:
  stage: test
  script:
    - *install
    - pytest -q --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

examples:
  stage: examples
  variables:
    VULNOPS_LLM_ENABLED: "false"
  script:
    - *install
    - vulnops validate examples/*/client.yaml
    - detect plan examples/lab/targets.yaml --profile examples/lab/client.yaml
    - scripts/run-pipeline.sh --fixtures tests/fixtures --since 2099-10-01 --include-updated
  artifacts:
    paths: [output/]
    expire_in: 7 days

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - |
      want="${CI_COMMIT_TAG#v}"
      for p in vulnops via detect verdict; do
        got=$(sed -n 's/^version = "\(.*\)"/\1/p' $p/pyproject.toml)
        [ "$got" = "$want" ] || { echo "$p/pyproject.toml has version $got, tag says $want"; exit 1; }
      done
      echo "vulnops $CI_COMMIT_TAG: client projects can include templates/client-pipeline.yml at ref $CI_COMMIT_TAG"
