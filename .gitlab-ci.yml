# vulnops pipeline
#
# - lint / test / validate run on every push and merge request.
# - The data pipeline (intel -> detect -> triage) runs on a schedule (Build > Pipeline schedules,
#   variable TRIAGE_MODE=daily) or by hand (New pipeline, TRIAGE_MODE=manual, optional
#   TRIAGE_CVES="CVE-... CVE-..."). Each stage hands its output to the next as an artifact.
#   Runner tag `llm-lan`: Internet access to the sources (directly or via HTTPS_PROXY) and access
#   to the LLM endpoint. CI/CD variables: VULNOPS_LLM_ENABLED, VULNOPS_LLM_BASE_URL,
#   VULNOPS_LLM_MODEL (the former VERDICT_* names still work), LLM_API_KEY if the server needs one.

stages: [lint, test, validate, intel, detect, triage]

default:
  image: python:3.12-slim
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  VULNOPS_CACHE_DIR: "$CI_PROJECT_DIR/.cache"

.install: &install
  - pip install --quiet -r requirements-dev.txt

.code_rules: &code_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $TRIAGE_MODE
      when: never
    - when: on_success

.pipeline_rules: &pipeline_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $TRIAGE_MODE == "daily"
    - if: $CI_PIPELINE_SOURCE == "web" && $TRIAGE_MODE == "manual"

lint:
  stage: lint
  <<: *code_rules
  cache: {key: pip, paths: [.pip-cache/]}
  script:
    - *install
    - ruff check .
    - ruff format --check .

test:
  stage: test
  <<: *code_rules
  cache: {key: pip, paths: [.pip-cache/]}
  script:
    - *install
    - pytest -q --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

validate-profiles:
  stage: validate
  cache: {key: pip, paths: [.pip-cache/]}
  script:
    - *install
    - vulnops-profiles validate clients/*.yaml

intel:
  stage: intel
  tags: [llm-lan]
  interruptible: false
  <<: *pipeline_rules
  cache:
    - {key: pip, paths: [.pip-cache/]}
    - {key: sources, paths: [.cache/]}
  script:
    - *install
    - |
      ARGS=""
      for c in $TRIAGE_CVES; do ARGS="$ARGS --cve $c"; done
      if [ -z "$ARGS" ]; then ARGS="--since ${TRIAGE_SINCE:-26h}"; fi
      vulnops-intel collect --settings config/settings.yaml --out work/records.json $ARGS
  artifacts:
    paths: [work/records.json]
    expire_in: 7 days

detect:
  stage: detect
  tags: [llm-lan]
  interruptible: false
  <<: *pipeline_rules
  needs: [intel]
  cache: {key: pip, paths: [.pip-cache/]}
  script:
    - *install
    - vulnops-detect inventory clients/*.yaml --settings config/settings.yaml --records work/records.json --out work/findings
  artifacts:
    paths: [work/findings/]
    expire_in: 7 days

triage:
  stage: triage
  tags: [llm-lan]
  interruptible: false
  <<: *pipeline_rules
  needs: [intel, detect]
  cache: {key: pip, paths: [.pip-cache/]}
  script:
    - *install
    - verdict run clients/*.yaml --settings config/settings.yaml --records work/records.json --findings work/findings --out output
  artifacts:
    name: "triage-$CI_PIPELINE_ID"
    paths: [output/]
    expire_in: 30 days
