# Repository-wide tooling only. a2vm/ is the common contract; each pillar is its own package: via/, detect/, verdict/.
# Development install: pip install -r requirements-dev.txt

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["a2vm", "via", "detect", "verdict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
