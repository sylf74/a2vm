# Repository-wide tooling only. Each stage is its own package: core/, intel/, detect/, verdict/.
# Development install: pip install -r requirements-dev.txt

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vulnops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
