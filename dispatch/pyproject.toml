[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch"
version = "0.11.5"
description = "Dispatch & Capitalization, pillar 4: the reporting database and what dashboarding tools read."
requires-python = ">=3.11"
license = {text = "LicenseRef-a2vm-proprietary"}
dependencies = ["a2vm", "psycopg[binary]>=3.1"]

[project.scripts]
dispatch = "dispatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dispatch" = ["sql/*.sql", "grafana/*.json"]
