[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch"
version = "0.23.8"
description = "Pillar 4 (Dispatch & Capitalization): the decisions carried to the tools of the teams that act on them, remediation tickets first."
requires-python = ">=3.11"
license = {text = "LicenseRef-a2vm-proprietary"}
dependencies = ["a2vm", "httpx>=0.27", "psycopg[binary]>=3.1"]

[project.scripts]
dispatch = "dispatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
