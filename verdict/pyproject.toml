[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict"
version = "0.18.0"
description = "Pillar 3 (Triage & Prioritization): asset context, deterministic SSVC decisions, LLM-written rationale, restitution (reporting database, Grafana)."
requires-python = ">=3.11"
license = {text = "LicenseRef-a2vm-proprietary"}
dependencies = ["a2vm", "psycopg[binary]>=3.1", "python-docx>=1.1", "python-pptx>=1.0"]  # documents of the chat (v0.15.1)

[project.scripts]
verdict = "verdict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"verdict.restitution" = ["sql/*.sql", "grafana/*.json"]
