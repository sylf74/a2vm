[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict"
version = "0.10.0"
description = "Pillar 3 (Triage & Prioritization): asset context and deterministic SSVC decisions, LLM-written rationale."
requires-python = ">=3.11"
license = {text = "LicenseRef-vulnops-proprietary"}
dependencies = ["vulnops"]

[project.scripts]
verdict = "verdict.cli:main"

# Offered to the other pillars through the vulnops extension points (vulnops.extensions).
[project.entry-points."vulnops.remediation_timeline"]
verdict = "verdict.timeline:remediation_timeline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"verdict" = ["data/*"]
