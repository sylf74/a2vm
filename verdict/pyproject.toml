[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnops-verdict"
version = "0.8.0"
description = "vulnops triage stage: deterministic SSVC decisions on findings, LLM-written rationale."
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = ["vulnops-core"]

[project.scripts]
verdict = "vulnops.verdict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"vulnops.verdict" = ["data/*"]
