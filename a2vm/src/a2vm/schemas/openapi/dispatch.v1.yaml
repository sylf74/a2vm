# Contract of the pillar 4 dispatch service (HLD D15, D18, LLD dispatch-capitalization §6).
# Status: v1, as built in v0.20.0 (dispatch serve). Within v1, fields and calls are only added.
openapi: 3.1.0
info:
  title: A2VM dispatch service
  version: "1.0.0"
  description: >
    Carries the decisions of one tenant to the tools of the teams that act on them: remediation
    tickets in the ITSM, one per asset and fix, followed until a scan confirms the fix. The daily run
    holds the run token and asks the service to process the newest run of the decision service; the
    tools hold the read token. The page of the requests for remediation (port 8081, behind
    oauth2-proxy, D18) is not part of this API. Every call carries the tenant; reached inside the
    cluster only.
servers:
  - url: http://a2vm-lab-dispatch:8080
tags:
  - name: jobs
  - name: read
  - name: operations
paths:
  /v1/tenants/{tenant}/runs:
    post:
      tags: [jobs]
      operationId: processRun
      summary: Process the newest run of the decision service (automatic tickets, follow-up)
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/tenant"
      responses:
        "200": {description: Processed, content: {application/json: {schema: {$ref: "#/components/schemas/RunSummary"}}}}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /v1/tenants/{tenant}/tickets:
    get:
      tags: [read]
      operationId: listTickets
      summary: The tickets of the tenant
      security:
        - readToken: []
      parameters:
        - $ref: "#/components/parameters/tenant"
        - {name: state, in: query, schema: {enum: [open, proposed, sent, in-progress, claimed-fixed, fixed, dropped, lost]}}
        - {name: asset, in: query, schema: {type: string}}
      responses:
        "200":
          description: The tickets
          content:
            application/json:
              schema:
                type: object
                required: [mode, total, items]
                properties:
                  mode: {enum: [dry-run, live]}
                  total: {type: integer}
                  items: {type: array, items: {$ref: "#/components/schemas/TicketSummary"}}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/tenants/{tenant}/tickets/{id}:
    get:
      tags: [read]
      operationId: getTicket
      summary: One ticket with its findings and its history
      security:
        - readToken: []
      parameters:
        - $ref: "#/components/parameters/tenant"
        - {name: id, in: path, required: true, schema: {type: string}, description: "id of the summary, or the key"}
      responses:
        "200": {description: The ticket, content: {application/json: {schema: {type: object}}}}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/tenants/{tenant}/requests:
    get:
      tags: [read]
      operationId: listRequests
      summary: The requests for remediation of the persons, newest first
      security:
        - readToken: []
      parameters:
        - $ref: "#/components/parameters/tenant"
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
      responses:
        "200": {description: The requests, content: {application/json: {schema: {type: object}}}}
        "401": {$ref: "#/components/responses/Problem"}
  /healthz:
    get:
      tags: [operations]
      operationId: healthz
      responses:
        "200": {description: Alive}
  /readyz:
    get:
      tags: [operations]
      operationId: readyz
      responses:
        "200": {description: The store is reachable}
        "503": {description: The store is not reachable}
components:
  securitySchemes:
    runToken:
      type: http
      scheme: bearer
      description: Token of the daily run; the service keeps its digest only.
    readToken:
      type: http
      scheme: bearer
      description: Token of the tools; reads the tickets and the requests.
  parameters:
    tenant:
      name: tenant
      in: path
      required: true
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$"}
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    RunSummary:
      type: object
      required: [run, mode]
      properties:
        run: {type: [object, "null"], description: "{id, generated_at} of the run processed"}
        mode: {enum: [dry-run, live]}
        proposed: {type: integer}
        sent: {type: integer}
        updated: {type: integer}
        fixed: {type: integer}
        claimed_fixed: {type: integer}
        reopened: {type: integer}
        errors: {type: integer}
        detail: {type: string}
    TicketSummary:
      type: object
      required: [id, key, asset, fix, level, state]
      properties:
        id: {type: string}
        key: {type: string, description: "<asset id> / <fix>"}
        asset: {type: string}
        fix: {type: string}
        level: {enum: [ACT, ATTEND, TRACK]}
        due: {type: [string, "null"]}
        state: {enum: [proposed, sent, in-progress, claimed-fixed, fixed, dropped, lost]}
        origin: {enum: [rule, request]}
        requested_by: {type: string}
        target: {type: string}
        external: {type: object, properties: {ref: {type: string}, url: {type: string}, status: {type: string}}}
        findings: {type: integer}
        open_findings: {type: integer}
        updated_at: {type: string}
        error: {type: string}
    Problem:
      type: object
      properties:
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
