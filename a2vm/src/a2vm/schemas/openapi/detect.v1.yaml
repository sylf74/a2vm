# Contract of the pillar 2 detection service (HLD D15, LLD vulnerability-detection §8).
# Status: v1, as built in v0.13.0 (detect serve). Within v1, fields and calls are only added.
openapi: 3.1.0
info:
  title: A2VM detection service
  version: "1.0.0"
  description: >
    Collectors near the networks push one detection per source (vulnops.detection/1); the daily
    run and pillar 3 read the latest detection of each source and collector. Every call carries
    the tenant. Read calls stay inside the cluster; until service accounts, they carry the read
    token of the tenant's daily run.
servers:
  - url: https://detect.example.org
tags:
  - name: intake
    description: Pushes by the collectors
  - name: read
    description: Reads by the services of the cluster
  - name: operations
paths:
  /v1/tenants/{tenant}/detections:
    post:
      tags: [intake]
      operationId: pushDetection
      summary: Push one detection (one source, one run of a collector)
      security:
        - collectorToken: []
      parameters:
        - $ref: "#/components/parameters/tenant"
        - name: Idempotency-Key
          in: header
          required: true
          description: The collector's run id; a retry with the same key stores nothing new.
          schema: {type: string, maxLength: 128}
        - name: Content-Encoding
          in: header
          required: false
          schema: {type: string, enum: [gzip]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../detection.schema.json"
      responses:
        "202":
          description: Accepted and stored (or already stored under this idempotency key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Receipt"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403":
          description: The token's collector is not declared for this tenant or this source
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422":
          description: Not a valid vulnops.detection/1, client_id other than the tenant, or too old
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /v1/tenants/{tenant}/detections/latest:
    get:
      tags: [read]
      operationId: latestDetections
      summary: The latest accepted detection of each source and collector of the tenant
      description: >
        Two collectors of one tenant (two networks) may push the same source: one entry each; the
        daily run merges them.
      security:
        - serviceIdentity: []
      parameters:
        - $ref: "#/components/parameters/tenant"
        - name: source
          in: query
          required: false
          schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$"}
      responses:
        "200":
          description: One entry per source and collector
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/StoredDetection"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/tenants/{tenant}/detections/{id}:
    get:
      tags: [read]
      operationId: getDetection
      security:
        - serviceIdentity: []
      parameters:
        - $ref: "#/components/parameters/tenant"
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The detection and its receipt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoredDetection"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/tenants/{tenant}/collectors:
    get:
      tags: [operations]
      operationId: listCollectors
      summary: Declared collectors of the tenant and their last pushes
      security:
        - serviceIdentity: []
      parameters:
        - $ref: "#/components/parameters/tenant"
      responses:
        "200":
          description: One entry per declared collector
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CollectorStatus"}
  /healthz:
    get:
      tags: [operations]
      operationId: healthz
      security: []
      responses:
        "200": {description: Alive}
  /readyz:
    get:
      tags: [operations]
      operationId: readyz
      security: []
      responses:
        "200": {description: Ready (database reachable)}
        "503": {description: Not ready}
components:
  securitySchemes:
    collectorToken:
      type: http
      scheme: bearer
      description: Token of one collector, bound to one tenant and its declared sources; the service keeps its digest only.
    serviceIdentity:
      type: http
      scheme: bearer
      description: Kubernetes service account token of the calling service (target); v0.13.0 checks the read token of the tenant's daily run, kept by the service as a digest.
  parameters:
    tenant:
      name: tenant
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Receipt:
      type: object
      required: [id, tenant, collector, source, generated_at, received_at, digest]
      properties:
        id: {type: string}
        tenant: {type: string}
        collector: {type: string}
        source: {type: string}
        generated_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        digest: {type: string, description: "sha256 of the uncompressed body"}
        duplicate: {type: boolean, description: "true when the idempotency key was already stored"}
    StoredDetection:
      type: object
      required: [receipt, age_hours, detection]
      properties:
        receipt: {$ref: "#/components/schemas/Receipt"}
        age_hours: {type: number}
        detection: {$ref: "../detection.schema.json"}
    CollectorStatus:
      type: object
      required: [id, sources]
      properties:
        id: {type: string}
        description: {type: string}
        sources:
          type: array
          items:
            type: object
            required: [source, max_age_hours]
            properties:
              source: {type: string}
              max_age_hours: {type: number}
              last_received_at: {type: string, format: date-time}
              age_hours: {type: number}
              stale: {type: boolean}
              last_error: {type: string, description: "Last refused push (time and reason), until a push is accepted; kept in memory"}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
