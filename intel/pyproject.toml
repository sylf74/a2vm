[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnops-intel"
version = "0.8.0"
description = "vulnops intelligence stage: collects and normalises vulnerability records."
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = ["vulnops-core"]

[project.scripts]
vulnops-intel = "vulnops.intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

